<!DOCTYPE html>

<head>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #f8f5f0;
            font-family: 'Segoe UI', 'Noto Serif SC', 'KaiTi', '楷体', 'Songti SC', serif;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            line-height: 2.2;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: #fffcf8;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            border: 1px solid #e6d9cc;
        }
        h1 {
            font-size: 2.2rem;
            text-align: center;
            color: #5e3e2b;
            letter-spacing: 4px;
            font-weight: 500;
            margin-bottom: 0.5rem;
            border-bottom: 2px solid #d9c6b0;
            padding-bottom: 1.2rem;
        }
        .subhead {
            text-align: center;
            font-size: 1.1rem;
            color: #8b6f55;
            margin-bottom: 1rem;
            letter-spacing: 2px;
            font-style: italic;
        }
        .jumpbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem;
            margin: 1.2rem 0 2.5rem 0;
            padding: 0.9rem;
            background: #f4ebe2;
            border-radius: 14px;
            border: 1px solid #e6d9cc;
        }
        .jumpbar a {
            text-decoration: none;
            font-size: 0.92rem;
            color: #5e3e2b;
            background: #fffcf8;
            border: 1px solid #d9c6b0;
            border-radius: 10px;
            padding: 0.35rem 0.8rem;
            transition: background 0.2s, color 0.2s;
        }
        .jumpbar a:hover { background: #5e3e2b; color: #fff8f0; }
        .chapter-title {
            font-size: 1.6rem;
            text-align: center;
            color: #4a3322;
            margin: 2rem 0 2.5rem 0;
            font-weight: 600;
            letter-spacing: 3px;
            background: linear-gradient(to right, transparent, #efe3d8, transparent);
            padding: 0.8rem 0;
            scroll-margin-top: 1.5rem;
        }
        .chapter-title .eng-title {
            display: block;
            font-size: 1rem;
            font-weight: 400;
            color: #8b6f55;
            letter-spacing: 1px;
            margin-top: 0.4rem;
            font-style: italic;
        }
        .paragraph { margin-bottom: 2.2rem; text-align: justify; }
        .sentence { display: block; margin-bottom: 1.5rem; }
        .zh-line { display: block; margin-bottom: 0.3rem; }
        .word {
            display: inline-block;
            position: relative;
            cursor: pointer;
            font-size: 1.25rem;
            font-family: 'Noto Serif SC', 'KaiTi', serif;
            color: #1f1a15;
            margin: 0 0.05em;
            padding: 0.05em 0.1em;
            border-radius: 4px;
            transition: background-color 0.2s;
            vertical-align: middle;
        }
        .word:hover { background-color: #f0e4d8; }
        .word.revealed {
            background-color: #f4e8dc;
            box-shadow: 0 0 0 1px #d9c6b0;
        }
        .punct {
            font-family: 'Noto Serif SC', 'KaiTi', serif;
            font-size: 1.25rem;
            color: #1f1a15;
            vertical-align: middle;
        }
        .pinyin {
            display: none;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 100%;
            margin-bottom: 2px;
            background-color: #5e3e2b;
            color: #fff8f0;
            font-size: 0.7rem;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            letter-spacing: 0.5px;
            padding: 0.15em 0.5em;
            border-radius: 12px;
            white-space: nowrap;
            z-index: 10;
            line-height: 1.4;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            pointer-events: none;
        }
        .word.revealed .pinyin { display: block; }
        .eng-line {
            display: block;
            font-size: 0.95rem;
            color: #7a6554;
            font-family: 'Segoe UI', 'Georgia', serif;
            line-height: 1.6;
            padding-left: 0.5rem;
            border-left: 2px solid #d9c6b0;
            margin-top: 0.2rem;
            margin-bottom: 0.4rem;
            font-style: italic;
        }
        .note {
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px dashed #cdb9a8;
            font-size: 0.9rem;
            color: #7a5e4b;
            text-align: center;
            font-style: italic;
        }
        .hint {
            text-align: center;
            font-size: 0.85rem;
            color: #a0785a;
            margin-bottom: 1rem;
            font-style: italic;
        }
        @media (max-width: 600px) {
            .container { padding: 1.8rem 1.2rem; }
            h1 { font-size: 1.6rem; letter-spacing: 2px; }
            .word, .punct { font-size: 1.1rem; }
            .chapter-title { font-size: 1.2rem; }
            .eng-line { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>三国演义</h1>
    <div class="subhead">第十二回 · 点击汉字显示拼音 + 英译</div>
    <div class="hint">👆 点击任意汉字即可显示/隐藏其拼音</div>

    <nav class="jumpbar">
        <a href="#s1">濮阳中计</a>
        <a href="#s2">典韦救主</a>
        <a href="#s3">陶谦让州</a>
        <a href="#s4">刘备领徐州</a>
    </nav>

    <div id="story"></div>

    <div class="note">
        —— 第十二回 · 点击汉字显示拼音 + 英译 ——
    </div>
</div>

<script>
const SENTENCES = [
    {
        type: "title",
        zh: "陶|táo 恭|gōng 祖|zǔ 三|sān 让|ràng 徐|xú 州|zhōu · 曹|cáo 孟|mèng 德|dé 大|dà 战|zhàn 吕|lǚ 布|bù",
        en: "Tao Gongzu Thrice Yields Xuzhou; Cao Mengde Fights a Great Battle with Lü Bu"
    },
    {
        type: "para", id: "s1",
        sentences: [
            {
                zh: "吕|lǚ 布|bù 与|yǔ 陈|chén 宫|gōng 定|dìng 计|jì ，令|lìng 濮|pú 阳|yáng 富|fù 户|hù 田|tián 氏|shì 诈|zhà 降|xiáng 曹|cáo 操|cāo ，诱|yòu 其|qí 入|rù 城|chéng 。曹|cáo 操|cāo 求|qiú 胜|shèng 心|xīn 切|qiè ，不|bù 听|tīng 刘|liú 晔|yè 劝|quàn 阻|zǔ ，亲|qīn 率|shuài 军|jūn 队|duì 进|jìn 入|rù 濮|pú 阳|yáng 城|chéng 。",
                en: "Lü Bu and Chen Gong devised a plan: they had the wealthy Tian family of Puyang feign surrender to Cao Cao and lure him into the city. Cao Cao, eager for victory, ignored Liu Ye's warning and personally led his troops into Puyang."
            }
        ]
    },
    {
        type: "para", id: "s2",
        sentences: [
            {
                zh: "曹|cáo 操|cāo 入|rù 城|chéng 后|hòu ，四|sì 门|mén 火|huǒ 起|qǐ ，伏|fú 兵|bīng 四|sì 出|chū 。曹|cáo 操|cāo 仓|cāng 皇|huáng 突|tū 围|wéi ，正|zhèng 遇|yù 吕|lǚ 布|bù 挺|tǐng 戟|jǐ 追|zhuī 来|lái 。典|diǎn 韦|wéi 以|yǐ 手|shǒu 戟|jǐ 死|sǐ 战|zhàn ，保|bǎo 护|hù 曹|cáo 操|cāo 杀|shā 出|chū 城|chéng 门|mén 。曹|cáo 操|cāo 手|shǒu 臂|bì 被|bèi 烧|shāo 伤|shāng ，险|xiǎn 些|xiē 丧|sàng 命|mìng 。",
                en: "After Cao Cao entered the city, fire broke out at all four gates and ambushers swarmed out. Cao Cao fled in panic and ran straight into Lü Bu, who charged at him with his halberd. Dian Wei fought desperately with his twin halberds, protecting Cao Cao as they cut their way out of the city gate. Cao Cao's arm was burned, and he nearly lost his life."
            }
        ]
    },
    {
        type: "para", id: "s3",
        sentences: [
            {
                zh: "陶|táo 谦|qiān 年|nián 老|liǎo 多|duō 病|bìng ，因|yīn 徐|xú 州|zhōu 百|bǎi 姓|xìng 遭|zāo 受|shòu 战|zhàn 乱|luàn 之|zhī 苦|kǔ ，决|jué 意|yì 将|jiāng 徐|xú 州|zhōu 让|ràng 与|yǔ 刘|liú 备|bèi 。刘|liú 备|bèi 再|zài 三|sān 推|tuī 辞|cí ，陶|táo 谦|qiān 恳|kěn 切|qiè 相|xiāng 求|qiú ，最|zuì 终|zhōng 刘|liú 备|bèi 答|dá 应|yìng 暂|zàn 领|lǐng 徐|xú 州|zhōu 之|zhī 事|shì 。",
                en: "Tao Qian was old and ailing, and because the people of Xuzhou had suffered so much from war, he resolved to yield Xuzhou to Liu Bei. Liu Bei declined repeatedly, but Tao Qian pleaded earnestly, and Liu Bei finally agreed to take temporary charge of Xuzhou."
            }
        ]
    },
    {
        type: "para", id: "s4",
        sentences: [
            {
                zh: "曹|cáo 操|cāo 闻|wén 刘|liú 备|bèi 领|lǐng 徐|xú 州|zhōu ，大|dà 怒|nù ，欲|yù 起|qǐ 兵|bīng 攻|gōng 打|dǎ 。谋|móu 士|shì 劝|quàn 他|tā 先|xiān 平|píng 吕|lǚ 布|bù 以|yǐ 绝|jué 后|hòu 患|huàn 。曹|cáo 操|cāo 从|cóng 之|zhī ，再|zài 次|zì 整|zhěng 军|jūn 与|yǔ 吕|lǚ 布|bù 对|duì 峙|zhì ，双|shuāng 方|fāng 大|dà 战|zhàn 于|yú 濮|pú 阳|yáng 一|yī 带|dài 。",
                en: "When Cao Cao learned that Liu Bei had taken charge of Xuzhou, he was furious and wanted to raise an army to attack. His advisors urged him to first deal with Lü Bu to eliminate the threat at his rear. Cao Cao followed their advice, reorganized his army, and once again faced Lü Bu, with the two sides fighting a great battle around Puyang."
            }
        ]
    }
];

function tokenToHtml(tok) {
    if (tok.startsWith("RAW")) return tok.slice(3);
    if (tok.includes("|")) {
        const [ch, py] = tok.split("|");
        return `<span class="word" data-pinyin="${py}">${ch}</span>`;
    }
    return `<span class="punct">${tok}</span>`;
}

function renderZh(zh) {
    return zh.split(/\s+/).filter(Boolean).map(tokenToHtml).join("");
}

function renderSentence(s) {
    return `<div class="sentence">
        <span class="zh-line">${renderZh(s.zh)}</span>
        <span class="eng-line">${s.en}</span>
    </div>`;
}

function render() {
    const root = document.getElementById("story");
    let html = "";
    for (const block of SENTENCES) {
        if (block.type === "title") {
            html += `<div class="chapter-title">${renderZh(block.zh)}<span class="eng-title">${block.en}</span></div>`;
        } else if (block.type === "para") {
            html += `<div class="paragraph"${block.id ? ` id="${block.id}"` : ""}>${block.sentences.map(renderSentence).join("")}</div>`;
        }
    }
    root.innerHTML = html;
    bindWords();
}

function bindWords() {
    document.querySelectorAll(".word").forEach(function (word) {
        var pinyinText = word.getAttribute("data-pinyin");
        if (pinyinText) {
            var pinyinSpan = document.createElement("span");
            pinyinSpan.className = "pinyin";
            pinyinSpan.textContent = pinyinText;
            word.appendChild(pinyinSpan);
        }
        word.addEventListener("click", function (e) {
            e.stopPropagation();
            this.classList.toggle("revealed");
        });
    });
}

document.addEventListener("click", function () {
    document.querySelectorAll(".word.revealed").forEach(function (w) {
        w.classList.remove("revealed");
    });
});

render();
</script>
</body>
</html>
