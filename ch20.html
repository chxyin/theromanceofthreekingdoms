<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三国演义 · 第二十回 · 点击显示拼音 + 英译</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #f8f5f0;
            font-family: 'Segoe UI', 'Noto Serif SC', 'KaiTi', '楷体', 'Songti SC', serif;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            line-height: 2.2;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: #fffcf8;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            border: 1px solid #e6d9cc;
        }
        h1 {
            font-size: 2.2rem;
            text-align: center;
            color: #5e3e2b;
            letter-spacing: 4px;
            font-weight: 500;
            margin-bottom: 0.5rem;
            border-bottom: 2px solid #d9c6b0;
            padding-bottom: 1.2rem;
        }
        .subhead {
            text-align: center;
            font-size: 1.1rem;
            color: #8b6f55;
            margin-bottom: 1rem;
            letter-spacing: 2px;
            font-style: italic;
        }
        .jumpbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem;
            margin: 1.2rem 0 2.5rem 0;
            padding: 0.9rem;
            background: #f4ebe2;
            border-radius: 14px;
            border: 1px solid #e6d9cc;
        }
        .jumpbar a {
            text-decoration: none;
            font-size: 0.92rem;
            color: #5e3e2b;
            background: #fffcf8;
            border: 1px solid #d9c6b0;
            border-radius: 10px;
            padding: 0.35rem 0.8rem;
            transition: background 0.2s, color 0.2s;
        }
        .jumpbar a:hover { background: #5e3e2b; color: #fff8f0; }
        .chapter-title {
            font-size: 1.6rem;
            text-align: center;
            color: #4a3322;
            margin: 2rem 0 2.5rem 0;
            font-weight: 600;
            letter-spacing: 3px;
            background: linear-gradient(to right, transparent, #efe3d8, transparent);
            padding: 0.8rem 0;
            scroll-margin-top: 1.5rem;
        }
        .chapter-title .eng-title {
            display: block;
            font-size: 1rem;
            font-weight: 400;
            color: #8b6f55;
            letter-spacing: 1px;
            margin-top: 0.4rem;
            font-style: italic;
        }
        .paragraph { margin-bottom: 2.2rem; text-align: justify; }
        .sentence { display: block; margin-bottom: 1.5rem; }
        .zh-line { display: block; margin-bottom: 0.3rem; }
        .word {
            display: inline-block;
            position: relative;
            cursor: pointer;
            font-size: 1.25rem;
            font-family: 'Noto Serif SC', 'KaiTi', serif;
            color: #1f1a15;
            margin: 0 0.05em;
            padding: 0.05em 0.1em;
            border-radius: 4px;
            transition: background-color 0.2s;
            vertical-align: middle;
        }
        .word:hover { background-color: #f0e4d8; }
        .word.revealed {
            background-color: #f4e8dc;
            box-shadow: 0 0 0 1px #d9c6b0;
        }
        .punct {
            font-family: 'Noto Serif SC', 'KaiTi', serif;
            font-size: 1.25rem;
            color: #1f1a15;
            vertical-align: middle;
        }
        .pinyin {
            display: none;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 100%;
            margin-bottom: 2px;
            background-color: #5e3e2b;
            color: #fff8f0;
            font-size: 0.7rem;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            letter-spacing: 0.5px;
            padding: 0.15em 0.5em;
            border-radius: 12px;
            white-space: nowrap;
            z-index: 10;
            line-height: 1.4;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            pointer-events: none;
        }
        .word.revealed .pinyin { display: block; }
        .eng-line {
            display: block;
            font-size: 0.95rem;
            color: #7a6554;
            font-family: 'Segoe UI', 'Georgia', serif;
            line-height: 1.6;
            padding-left: 0.5rem;
            border-left: 2px solid #d9c6b0;
            margin-top: 0.2rem;
            margin-bottom: 0.4rem;
            font-style: italic;
        }
        .note {
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px dashed #cdb9a8;
            font-size: 0.9rem;
            color: #7a5e4b;
            text-align: center;
            font-style: italic;
        }
        .hint {
            text-align: center;
            font-size: 0.85rem;
            color: #a0785a;
            margin-bottom: 1rem;
            font-style: italic;
        }
        @media (max-width: 600px) {
            .container { padding: 1.8rem 1.2rem; }
            h1 { font-size: 1.6rem; letter-spacing: 2px; }
            .word, .punct { font-size: 1.1rem; }
            .chapter-title { font-size: 1.2rem; }
            .eng-line { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>三国演义</h1>
    <div class="subhead">第二十回 · 点击汉字显示拼音 + 英译</div>
    <div class="hint">👆 点击任意汉字即可显示/隐藏其拼音</div>

    <nav class="jumpbar">
        <a href="#s1">许田射猎</a>
        <a href="#s2">衣带诏</a>
        <a href="#s3">刘备种菜</a>
        <a href="#s4">曹操煮酒</a>
    </nav>

    <div id="story"></div>

    <div class="note">
        —— 第二十回 · 点击汉字显示拼音 + 英译 ——
    </div>
</div>

<script>
const SENTENCES = [
    {
        type: "title",
        zh: "曹|cáo 阿|ā 瞒|mán 许|xǔ 田|tián 射|shè 猎|liè · 董|dǒng 国|guó 舅|jiù 府|fǔ 堂|táng 受|shòu 诏|zhào",
        en: "Cao Aman Hunts at Xutian; Uncle Dong Receives the Edict in His Hall"
    },
    {
        type: "para", id: "s1",
        sentences: [
            {
                zh: "曹|cáo 操|cāo 挟|xié 天|tiān 子|zǐ 以|yǐ 令|lìng 诸|zhū 侯|hóu ，威|wēi 势|shì 日|rì 盛|shèng 。一|yī 日|rì ，曹|cáo 操|cāo 请|qǐng 献|xiàn 帝|dì 至|zhì 许|xǔ 田|tián 打|dǎ 猎|liè ，百|bǎi 官|guān 随|suí 行|xíng 。献|xiàn 帝|dì 射|shè 鹿|lù 不|bù 中|zhòng ，曹|cáo 操|cāo 竟|jìng 夺|duó 过|guò 天|tiān 子|zǐ 弓|gōng 箭|jiàn ，一|yī 箭|jiàn 射|shè 中|zhòng 鹿|lù 背|bèi 。",
                en: "Cao Cao controlled the Emperor to command the lords, and his power grew daily. One day Cao Cao invited Emperor Xian to hunt at Xutian, with all the officials in attendance. When the Emperor missed a deer, Cao Cao boldly took the imperial bow and arrow and shot the deer in the back."
            },
            {
                zh: "群|qún 臣|chén 见|jiàn 鹿|lù 中|zhòng ，以|yǐ 为|wéi 天|tiān 子|zǐ 所|suǒ 射|shè ，齐|qí 呼|hū 万|wàn 岁|suì 。曹|cáo 操|cāo 纵|zòng 马|mǎ 挡|dǎng 在|zài 献|xiàn 帝|dì 前|qián 受|shòu 贺|hè ，众|zhòng 人|rén 皆|jiē 惊|jīng 。关|guān 羽|yǔ 欲|yù 斩|zhǎn 曹|cáo 操|cāo ，被|bèi 刘|liú 备|bèi 制|zhì 止|zhǐ 。",
                en: "When the officials saw the deer struck, they thought the Emperor had shot it and cheered \"Long live the Emperor!\" Cao Cao rode forward and blocked the Emperor to receive the acclaim himself, shocking everyone. Guan Yu wanted to cut Cao Cao down, but Liu Bei restrained him."
            }
        ]
    },
    {
        type: "para", id: "s2",
        sentences: [
            {
                zh: "献|xiàn 帝|dì 回|huí 宫|gōng 后|hòu ，深|shēn 感|gǎn 曹|cáo 操|cāo 欺|qī 凌|líng ，遂|suì 咬|yǎo 破|pò 指|zhǐ 尖|jiān ，以|yǐ 血|xuě 写|xiě 密|mì 诏|zhào 于|yú 衣|yī 带|dài 之|zhī 中|zhōng ，赐|cì 与|yǔ 国|guó 舅|jiù 董|dǒng 承|chéng ，令|lìng 其|qí 联|lián 合|hé 忠|zhōng 义|yì 之|zhī 士|shì 共|gòng 诛|zhū 曹|cáo 操|cāo 。",
                en: "After returning to the palace, Emperor Xian was deeply grieved by Cao Cao's bullying. He bit his fingertip and wrote a secret edict in blood on his belt, giving it to his uncle Dong Cheng and ordering him to unite loyal men to destroy Cao Cao."
            }
        ]
    },
    {
        type: "para", id: "s3",
        sentences: [
            {
                zh: "刘|liú 备|bèi 自|zì 知|zhī 身|shēn 处|chù 险|xiǎn 境|jìng ，遂|suì 在|zài 后|hòu 园|yuán 种|zhòng 菜|cài ，韬|tāo 光|guāng 养|yǎng 晦|huì 。关|guān 羽|yǔ 、张|zhāng 飞|fēi 不|bù 解|jiě 其|qí 意|yì ，刘|liú 备|bèi 只|zhǐ 说|shuō 是|shì 消|xiāo 遣|qiǎn 而|ér 已|yǐ 。",
                en: "Liu Bei, knowing he was in a dangerous position, took to growing vegetables in the back garden to hide his ambitions and bide his time. Guan Yu and Zhang Fei did not understand, and Liu Bei merely said he was passing the time."
            }
        ]
    },
    {
        type: "para", id: "s4",
        sentences: [
            {
                zh: "一|yī 日|rì ，曹|cáo 操|cāo 邀|yāo 刘|liú 备|bèi 煮|zhǔ 酒|jiǔ 论|lùn 英|yīng 雄|xióng 。曹|cáo 操|cāo 指|zhǐ 天|tiān 下|xià 诸|zhū 侯|hóu 皆|jiē 不|bù 足|zú 道|dào ，说|shuō ：“天|tiān 下|xià 英|yīng 雄|xióng ，惟|wéi 使|shǐ 君|jūn 与|yǔ 操|cāo 耳|ěr ！”刘|liú 备|bèi 闻|wén 言|yán 大|dà 惊|jīng ，借|jiè 雷|léi 声|shēng 掩|yǎn 饰|shì ，将|jiāng 筷|kuài 子|zi 掉|diào 落|luò 于|yú 地|dì 。",
                en: "One day Cao Cao invited Liu Bei to warm wine and discuss heroes. Cao Cao dismissed all the lords of the realm as unworthy and said: \"The only heroes under heaven are you and me!\" Liu Bei was greatly startled and used a clap of thunder as an excuse, dropping his chopsticks to the ground."
            }
        ]
    }
];

function tokenToHtml(tok) {
    if (tok.startsWith("RAW")) return tok.slice(3);
    if (tok.includes("|")) {
        const [ch, py] = tok.split("|");
        return `<span class="word" data-pinyin="${py}">${ch}</span>`;
    }
    return `<span class="punct">${tok}</span>`;
}

function renderZh(zh) {
    return zh.split(/\s+/).filter(Boolean).map(tokenToHtml).join("");
}

function renderSentence(s) {
    return `<div class="sentence">
        <span class="zh-line">${renderZh(s.zh)}</span>
        <span class="eng-line">${s.en}</span>
    </div>`;
}

function render() {
    const root = document.getElementById("story");
    let html = "";
    for (const block of SENTENCES) {
        if (block.type === "title") {
            html += `<div class="chapter-title">${renderZh(block.zh)}<span class="eng-title">${block.en}</span></div>`;
        } else if (block.type === "para") {
            html += `<div class="paragraph"${block.id ? ` id="${block.id}"` : ""}>${block.sentences.map(renderSentence).join("")}</div>`;
        }
    }
    root.innerHTML = html;
    bindWords();
}

function bindWords() {
    document.querySelectorAll(".word").forEach(function (word) {
        var pinyinText = word.getAttribute("data-pinyin");
        if (pinyinText) {
            var pinyinSpan = document.createElement("span");
            pinyinSpan.className = "pinyin";
            pinyinSpan.textContent = pinyinText;
            word.appendChild(pinyinSpan);
        }
        word.addEventListener("click", function (e) {
            e.stopPropagation();
            this.classList.toggle("revealed");
        });
    });
}

document.addEventListener("click", function () {
    document.querySelectorAll(".word.revealed").forEach(function (w) {
        w.classList.remove("revealed");
    });
});

render();
</script>
</body>
</html>
