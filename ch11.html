<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三国演义 · 第十一回 · 点击显示拼音 + 英译</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #f8f5f0;
            font-family: 'Segoe UI', 'Noto Serif SC', 'KaiTi', '楷体', 'Songti SC', serif;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            line-height: 2.2;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: #fffcf8;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            border: 1px solid #e6d9cc;
        }
        h1 {
            font-size: 2.2rem;
            text-align: center;
            color: #5e3e2b;
            letter-spacing: 4px;
            font-weight: 500;
            margin-bottom: 0.5rem;
            border-bottom: 2px solid #d9c6b0;
            padding-bottom: 1.2rem;
        }
        .subhead {
            text-align: center;
            font-size: 1.1rem;
            color: #8b6f55;
            margin-bottom: 1rem;
            letter-spacing: 2px;
            font-style: italic;
        }
        .jumpbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem;
            margin: 1.2rem 0 2.5rem 0;
            padding: 0.9rem;
            background: #f4ebe2;
            border-radius: 14px;
            border: 1px solid #e6d9cc;
        }
        .jumpbar a {
            text-decoration: none;
            font-size: 0.92rem;
            color: #5e3e2b;
            background: #fffcf8;
            border: 1px solid #d9c6b0;
            border-radius: 10px;
            padding: 0.35rem 0.8rem;
            transition: background 0.2s, color 0.2s;
        }
        .jumpbar a:hover { background: #5e3e2b; color: #fff8f0; }
        .chapter-title {
            font-size: 1.6rem;
            text-align: center;
            color: #4a3322;
            margin: 2rem 0 2.5rem 0;
            font-weight: 600;
            letter-spacing: 3px;
            background: linear-gradient(to right, transparent, #efe3d8, transparent);
            padding: 0.8rem 0;
            scroll-margin-top: 1.5rem;
        }
        .chapter-title .eng-title {
            display: block;
            font-size: 1rem;
            font-weight: 400;
            color: #8b6f55;
            letter-spacing: 1px;
            margin-top: 0.4rem;
            font-style: italic;
        }
        .paragraph { margin-bottom: 2.2rem; text-align: justify; }
        .sentence { display: block; margin-bottom: 1.5rem; }
        .zh-line { display: block; margin-bottom: 0.3rem; }
        .word {
            display: inline-block;
            position: relative;
            cursor: pointer;
            font-size: 1.25rem;
            font-family: 'Noto Serif SC', 'KaiTi', serif;
            color: #1f1a15;
            margin: 0 0.05em;
            padding: 0.05em 0.1em;
            border-radius: 4px;
            transition: background-color 0.2s;
            vertical-align: middle;
        }
        .word:hover { background-color: #f0e4d8; }
        .word.revealed {
            background-color: #f4e8dc;
            box-shadow: 0 0 0 1px #d9c6b0;
        }
        .punct {
            font-family: 'Noto Serif SC', 'KaiTi', serif;
            font-size: 1.25rem;
            color: #1f1a15;
            vertical-align: middle;
        }
        .pinyin {
            display: none;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 100%;
            margin-bottom: 2px;
            background-color: #5e3e2b;
            color: #fff8f0;
            font-size: 0.7rem;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            letter-spacing: 0.5px;
            padding: 0.15em 0.5em;
            border-radius: 12px;
            white-space: nowrap;
            z-index: 10;
            line-height: 1.4;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            pointer-events: none;
        }
        .word.revealed .pinyin { display: block; }
        .eng-line {
            display: block;
            font-size: 0.95rem;
            color: #7a6554;
            font-family: 'Segoe UI', 'Georgia', serif;
            line-height: 1.6;
            padding-left: 0.5rem;
            border-left: 2px solid #d9c6b0;
            margin-top: 0.2rem;
            margin-bottom: 0.4rem;
            font-style: italic;
        }
        .note {
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px dashed #cdb9a8;
            font-size: 0.9rem;
            color: #7a5e4b;
            text-align: center;
            font-style: italic;
        }
        .hint {
            text-align: center;
            font-size: 0.85rem;
            color: #a0785a;
            margin-bottom: 1rem;
            font-style: italic;
        }
        @media (max-width: 600px) {
            .container { padding: 1.8rem 1.2rem; }
            h1 { font-size: 1.6rem; letter-spacing: 2px; }
            .word, .punct { font-size: 1.1rem; }
            .chapter-title { font-size: 1.2rem; }
            .eng-line { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>三国演义</h1>
    <div class="subhead">第十一回 · 点击汉字显示拼音 + 英译</div>
    <div class="hint">👆 点击任意汉字即可显示/隐藏其拼音</div>

    <nav class="jumpbar">
        <a href="#s1">北海被围</a>
        <a href="#s2">太史慈救</a>
        <a href="#s3">刘备解围</a>
        <a href="#s4">濮阳之战</a>
    </nav>

    <div id="story"></div>

    <div class="note">
        —— 第十一回 · 点击汉字显示拼音 + 英译 ——
    </div>
</div>

<script>
const SENTENCES = [
    {
        type: "title",
        zh: "刘|liú 皇|huáng 叔|shū 北|běi 海|hǎi 救|jiù 孔|kǒng 融|róng · 吕|lǚ 温|wēn 侯|hóu 濮|pú 阳|yáng 破|pò 曹|cáo 操|cāo",
        en: "Uncle Liu Rescues Kong Rong at Beihai; Marquis Wen Breaks Cao Cao at Puyang"
    },
    {
        type: "para", id: "s1",
        sentences: [
            {
                zh: "曹|cáo 操|cāo 围|wéi 攻|gōng 徐|xú 州|zhōu ，陶|táo 谦|qiān 向|xiàng 北|běi 海|hǎi 太|tài 守|shǒu 孔|kǒng 融|róng 求|qiú 救|jiù 。孔|kǒng 融|róng 正|zhèng 要|yào 起|qǐ 兵|bīng ，不|bù 料|liào 黄|huáng 巾|jīn 余|yú 党|dǎng 管|guǎn 亥|hài 率|shuài 数|shù 万|wàn 人|rén 围|wéi 困|kùn 北|běi 海|hǎi 。孔|kǒng 融|róng 兵|bīng 少|shǎo ，只|zhǐ 得|de 闭|bì 城|chéng 坚|jiān 守|shǒu 。",
                en: "Cao Cao was besieging Xuzhou, and Tao Qian sought help from Kong Rong, the Governor of Beihai. Kong Rong was about to send troops when the Yellow Turban remnant Guan Hai surrounded Beihai with tens of thousands of men. Kong Rong had few soldiers and could only close the gates and hold out."
            }
        ]
    },
    {
        type: "para", id: "s2",
        sentences: [
            {
                zh: "东|dōng 莱|lái 人|rén 太|tài 史|shǐ 慈|cí 因|yīn 感|gǎn 念|niàn 孔|kǒng 融|róng 对|duì 其|qí 母|mǔ 亲|qīn 的|de 照|zhào 顾|gù ，单|dān 骑|qí 杀|shā 入|rù 贼|zéi 阵|zhèn ，冲|chōng 到|dào 城|chéng 下|xià 。孔|kǒng 融|róng 将|jiāng 他|tā 迎|yíng 入|rù 城|chéng 中|zhōng ，太|tài 史|shǐ 慈|cí 自|zì 告|gào 奋|fèn 勇|yǒng 突|tū 围|wéi ，前|qián 往|wǎng 平|píng 原|yuán 向|xiàng 刘|liú 备|bèi 求|qiú 救|jiù 。",
                en: "Taishi Ci of Donglai, grateful for Kong Rong's kindness to his mother, charged alone into the rebel lines and reached the city gate. Kong Rong brought him inside, and Taishi Ci volunteered to break through the siege and go to Pingyuan to seek help from Liu Bei."
            }
        ]
    },
    {
        type: "para", id: "s3",
        sentences: [
            {
                zh: "刘|liú 备|bèi 闻|wén 讯|xùn ，立|lì 即|jí 率|shuài 关|guān 羽|yǔ 、张|zhāng 飞|fēi 及|jí 三|sān 千|qiān 兵|bīng 马|mǎ 赶|gǎn 赴|fù 北|běi 海|hǎi 。关|guān 羽|yǔ 阵|zhèn 前|qián 斩|zhǎn 杀|shā 管|guǎn 亥|hài ，黄|huáng 巾|jīn 军|jūn 溃|kuì 散|sàn 。孔|kǒng 融|róng 得|dé 救|jiù ，与|yǔ 刘|liú 备|bèi 同|tóng 往|wǎng 徐|xú 州|zhōu 救|jiù 陶|táo 谦|qiān 。曹|cáo 操|cāo 因|yīn 后|hòu 方|fāng 吕|lǚ 布|bù 来|ái 袭|xí ，只|zhǐ 得|de 撤|chè 军|jūn 而|ér 退|tuì 。",
                en: "When Liu Bei heard the news, he immediately led Guan Yu, Zhang Fei, and three thousand troops to Beihai. Guan Yu slew Guan Hai before the ranks, and the Yellow Turban army scattered. Kong Rong was saved and went with Liu Bei to relieve Tao Qian at Xuzhou. Cao Cao, because Lü Bu was attacking his rear, was forced to withdraw."
            }
        ]
    },
    {
        type: "para", id: "s4",
        sentences: [
            {
                zh: "曹|cáo 操|cāo 回|huí 师|shī 迎|yíng 战|zhàn 吕|lǚ 布|bù ，两|liǎng 军|jūn 大|dà 战|zhàn 于|yú 濮|pú 阳|yáng 。吕|lǚ 布|bù 勇|yǒng 猛|měng ，曹|cáo 操|cāo 一|yī 度|dù 陷|xiàn 入|rù 险|xiǎn 境|jìng ，赖|lài 典|diǎn 韦|wéi 拼|pīn 死|sǐ 相|xiāng 救|jiù 方|fāng 得|de 脱|tuō 身|shēn 。两|liǎng 军|jūn 相|xiāng 持|chí ，胜|shèng 负|fù 未|wèi 分|fēn 。",
                en: "Cao Cao turned his army back to face Lü Bu, and the two forces fought a great battle at Puyang. Lü Bu was fierce, and Cao Cao was once in grave danger, escaping only because Dian Wei fought desperately to save him. The two armies remained locked in a stalemate, with no victory decided."
            }
        ]
    }
];

function tokenToHtml(tok) {
    if (tok.startsWith("RAW")) return tok.slice(3);
    if (tok.includes("|")) {
        const [ch, py] = tok.split("|");
        return `<span class="word" data-pinyin="${py}">${ch}</span>`;
    }
    return `<span class="punct">${tok}</span>`;
}

function renderZh(zh) {
    return zh.split(/\s+/).filter(Boolean).map(tokenToHtml).join("");
}

function renderSentence(s) {
    return `<div class="sentence">
        <span class="zh-line">${renderZh(s.zh)}</span>
        <span class="eng-line">${s.en}</span>
    </div>`;
}

function render() {
    const root = document.getElementById("story");
    let html = "";
    for (const block of SENTENCES) {
        if (block.type === "title") {
            html += `<div class="chapter-title">${renderZh(block.zh)}<span class="eng-title">${block.en}</span></div>`;
        } else if (block.type === "para") {
            html += `<div class="paragraph"${block.id ? ` id="${block.id}"` : ""}>${block.sentences.map(renderSentence).join("")}</div>`;
        }
    }
    root.innerHTML = html;
    bindWords();
}

function bindWords() {
    document.querySelectorAll(".word").forEach(function (word) {
        var pinyinText = word.getAttribute("data-pinyin");
        if (pinyinText) {
            var pinyinSpan = document.createElement("span");
            pinyinSpan.className = "pinyin";
            pinyinSpan.textContent = pinyinText;
            word.appendChild(pinyinSpan);
        }
        word.addEventListener("click", function (e) {
            e.stopPropagation();
            this.classList.toggle("revealed");
        });
    });
}

document.addEventListener("click", function () {
    document.querySelectorAll(".word.revealed").forEach(function (w) {
        w.classList.remove("revealed");
    });
});

render();
</script>
</body>
</html>
