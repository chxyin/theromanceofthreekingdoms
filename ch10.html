<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三国演义 · 第十回 · 点击显示拼音 + 英译</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #f8f5f0;
            font-family: 'Segoe UI', 'Noto Serif SC', 'KaiTi', '楷体', 'Songti SC', serif;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            line-height: 2.2;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: #fffcf8;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            border: 1px solid #e6d9cc;
        }
        h1 {
            font-size: 2.2rem;
            text-align: center;
            color: #5e3e2b;
            letter-spacing: 4px;
            font-weight: 500;
            margin-bottom: 0.5rem;
            border-bottom: 2px solid #d9c6b0;
            padding-bottom: 1.2rem;
        }
        .subhead {
            text-align: center;
            font-size: 1.1rem;
            color: #8b6f55;
            margin-bottom: 1rem;
            letter-spacing: 2px;
            font-style: italic;
        }
        .jumpbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem;
            margin: 1.2rem 0 2.5rem 0;
            padding: 0.9rem;
            background: #f4ebe2;
            border-radius: 14px;
            border: 1px solid #e6d9cc;
        }
        .jumpbar a {
            text-decoration: none;
            font-size: 0.92rem;
            color: #5e3e2b;
            background: #fffcf8;
            border: 1px solid #d9c6b0;
            border-radius: 10px;
            padding: 0.35rem 0.8rem;
            transition: background 0.2s, color 0.2s;
        }
        .jumpbar a:hover { background: #5e3e2b; color: #fff8f0; }
        .chapter-title {
            font-size: 1.6rem;
            text-align: center;
            color: #4a3322;
            margin: 2rem 0 2.5rem 0;
            font-weight: 600;
            letter-spacing: 3px;
            background: linear-gradient(to right, transparent, #efe3d8, transparent);
            padding: 0.8rem 0;
            scroll-margin-top: 1.5rem;
        }
        .chapter-title .eng-title {
            display: block;
            font-size: 1rem;
            font-weight: 400;
            color: #8b6f55;
            letter-spacing: 1px;
            margin-top: 0.4rem;
            font-style: italic;
        }
        .paragraph { margin-bottom: 2.2rem; text-align: justify; }
        .sentence { display: block; margin-bottom: 1.5rem; }
        .zh-line { display: block; margin-bottom: 0.3rem; }
        .word {
            display: inline-block;
            position: relative;
            cursor: pointer;
            font-size: 1.25rem;
            font-family: 'Noto Serif SC', 'KaiTi', serif;
            color: #1f1a15;
            margin: 0 0.05em;
            padding: 0.05em 0.1em;
            border-radius: 4px;
            transition: background-color 0.2s;
            vertical-align: middle;
        }
        .word:hover { background-color: #f0e4d8; }
        .word.revealed {
            background-color: #f4e8dc;
            box-shadow: 0 0 0 1px #d9c6b0;
        }
        .punct {
            font-family: 'Noto Serif SC', 'KaiTi', serif;
            font-size: 1.25rem;
            color: #1f1a15;
            vertical-align: middle;
        }
        .pinyin {
            display: none;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 100%;
            margin-bottom: 2px;
            background-color: #5e3e2b;
            color: #fff8f0;
            font-size: 0.7rem;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            letter-spacing: 0.5px;
            padding: 0.15em 0.5em;
            border-radius: 12px;
            white-space: nowrap;
            z-index: 10;
            line-height: 1.4;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            pointer-events: none;
        }
        .word.revealed .pinyin { display: block; }
        .eng-line {
            display: block;
            font-size: 0.95rem;
            color: #7a6554;
            font-family: 'Segoe UI', 'Georgia', serif;
            line-height: 1.6;
            padding-left: 0.5rem;
            border-left: 2px solid #d9c6b0;
            margin-top: 0.2rem;
            margin-bottom: 0.4rem;
            font-style: italic;
        }
        .note {
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px dashed #cdb9a8;
            font-size: 0.9rem;
            color: #7a5e4b;
            text-align: center;
            font-style: italic;
        }
        .hint {
            text-align: center;
            font-size: 0.85rem;
            color: #a0785a;
            margin-bottom: 1rem;
            font-style: italic;
        }
        @media (max-width: 600px) {
            .container { padding: 1.8rem 1.2rem; }
            h1 { font-size: 1.6rem; letter-spacing: 2px; }
            .word, .punct { font-size: 1.1rem; }
            .chapter-title { font-size: 1.2rem; }
            .eng-line { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>三国演义</h1>
    <div class="subhead">第十回 · 点击汉字显示拼音 + 英译</div>
    <div class="hint">👆 点击任意汉字即可显示/隐藏其拼音</div>

    <nav class="jumpbar">
        <a href="#s1">李郭掌权</a>
        <a href="#s2">马腾举义</a>
        <a href="#s3">马超逞威</a>
        <a href="#s4">曹操兴师</a>
    </nav>

    <div id="story"></div>

    <div class="note">
        —— 第十回 · 点击汉字显示拼音 + 英译 ——
    </div>
</div>

<script>
const SENTENCES = [
    {
        type: "title",
        zh: "勤|qín 王|wáng 室|shì 马|mǎ 腾|téng 举|jǔ 义|yì · 报|bào 父|fù 仇|chóu 曹|cáo 操|cāo 兴|xīng 师|shī",
        en: "Supporting the Royal House, Ma Teng Raises Righteous Arms; Avenging His Father, Cao Cao Sends Forth an Army"
    },
    {
        type: "para", id: "s1",
        sentences: [
            {
                zh: "董|dǒng 卓|zhuó 死|sǐ 后|hòu ，李|lǐ 傕|què 、郭|guō 汜|sì 等|děng 人|rén 上|shàng 表|biǎo 求|qiú 封|fēng ，献|xiàn 帝|dì 被|bèi 迫|pò 答|dá 应|yìng 。李|lǐ 傕|què 为|wéi 车|chē 骑|qí 将|jiāng 军|jūn ，郭|guō 汜|sì 为|wéi 后|hòu 将|jiāng 军|jūn ，二|èr 人|rén 共|gòng 掌|zhǎng 朝|cháo 政|zhèng ，残|cán 虐|nüè 百|bǎi 姓|xìng 。",
                en: "After Dong Zhuo's death, Li Jue, Guo Si, and the others submitted memorials demanding titles, and Emperor Xian was forced to comply. Li Jue became General of Chariots and Cavalry, Guo Si General of the Rear, and the two jointly controlled the court, tyrannizing the people."
            },
            {
                zh: "西|xī 凉|liáng 太|tài 守|shǒu 马|mǎ 腾|téng 与|yǔ 并|bìng 州|zhōu 刺|cì 史|shǐ 韩|hán 遂|suì 联|lián 合|hé 起|qǐ 兵|bīng 十|shí 余|yú 万|wàn ，声|shēng 言|yán 讨|tǎo 伐|fá 李|lǐ 傕|què 、郭|guō 汜|sì ，以|yǐ 清|qīng 君|jūn 侧|cè 。",
                en: "Ma Teng, the Governor of Xiliang, and Han Sui, the Inspector of Bingzhou, joined forces with over a hundred thousand troops, proclaiming their intent to punish Li Jue and Guo Si and cleanse the court."
            }
        ]
    },
    {
        type: "para", id: "s2",
        sentences: [
            {
                zh: "李|lǐ 傕|què 采|cǎi 纳|nà 贾|jiǎ 诩|xǔ 之|zhī 计|jì ，派|pài 张|zhāng 济|jì 、樊|fán 稠|chóu 守|shǒu 险|xian ，李|lǐ 蒙|méng 、王|wáng 方|fāng 率|shuài 兵|bīng 迎|yíng 敌|dí 。贾|jiǎ 诩|xǔ 预|yù 言|yán 此|zì 战|zhàn 必|bì 败|bài ，李|lǐ 蒙|méng 、王|wáng 方|fāng 不|bù 服|fú 。",
                en: "Li Jue adopted Jia Xu's plan, sending Zhang Ji and Fan Chou to hold the passes while Li Meng and Wang Fang led troops to meet the enemy. Jia Xu predicted this battle would surely be lost, but Li Meng and Wang Fang refused to accept it."
            }
        ]
    },
    {
        type: "para", id: "s3",
        sentences: [
            {
                zh: "两|liǎng 军|jūn 对|duì 阵|zhèn ，马|mǎ 腾|téng 之|zhī 子|zǐ 马|mǎ 超|chāo 挺|tǐng 枪|qiāng 出|chū 战|zhàn 。马|mǎ 超|chāo 年|nián 方|fāng 十|shí 七|qī ，英|yīng 勇|yǒng 无|wú 敌|dí ，数|shù 合|hé 之|zhī 间|jiān 便|biàn 刺|zì 王|wáng 方|fāng 于|yú 马|mǎ 下|xià ，又|yòu 生|shēng 擒|qín 李|lǐ 蒙|méng 。西|xī 凉|liáng 军|jūn 大|dà 获|huò 全|quán 胜|shèng 。",
                en: "The two armies faced each other, and Ma Teng's son Ma Chao rode out with his spear. Ma Chao was only seventeen but unmatched in bravery; within a few bouts he stabbed Wang Fang from his horse and captured Li Meng alive. The Xiliang army won a complete victory."
            }
        ]
    },
    {
        type: "para", id: "s4",
        sentences: [
            {
                zh: "曹|cáo 操|cāo 在|zài 兖|yǎn 州|zhōu 招|zhāo 兵|bīng 买|mǎi 马|mǎ ，势|shì 力|lì 渐|jiàn 大|dà 。其|qí 父|fù 曹|cáo 嵩|sōng 路|lù 过|guò 徐|xú 州|zhōu ，被|bèi 徐|xú 州|zhōu 牧|mù 陶|táo 谦|qiān 部|bù 将|jiàng 所|suǒ 杀|shā 。曹|cáo 操|cāo 闻|wén 讯|xùn 大|dà 怒|nù ，亲|qīn 率|shuài 大|dà 军|jūn 杀|shā 奔|bēn 徐|xú 州|zhōu ，誓|shì 报|bào 父|fù 仇|chóu 。",
                en: "Cao Cao was recruiting soldiers and buying horses in Yanzhou, and his power was growing. His father Cao Song, passing through Xuzhou, was killed by subordinates of Tao Qian, the Governor of Xuzhou. When Cao Cao learned of this he was furious, and personally led a great army to Xuzhou, swearing to avenge his father."
            }
        ]
    }
];

function tokenToHtml(tok) {
    if (tok.startsWith("RAW")) return tok.slice(3);
    if (tok.includes("|")) {
        const [ch, py] = tok.split("|");
        return `<span class="word" data-pinyin="${py}">${ch}</span>`;
    }
    return `<span class="punct">${tok}</span>`;
}

function renderZh(zh) {
    return zh.split(/\s+/).filter(Boolean).map(tokenToHtml).join("");
}

function renderSentence(s) {
    return `<div class="sentence">
        <span class="zh-line">${renderZh(s.zh)}</span>
        <span class="eng-line">${s.en}</span>
    </div>`;
}

function render() {
    const root = document.getElementById("story");
    let html = "";
    for (const block of SENTENCES) {
        if (block.type === "title") {
            html += `<div class="chapter-title">${renderZh(block.zh)}<span class="eng-title">${block.en}</span></div>`;
        } else if (block.type === "para") {
            html += `<div class="paragraph"${block.id ? ` id="${block.id}"` : ""}>${block.sentences.map(renderSentence).join("")}</div>`;
        }
    }
    root.innerHTML = html;
    bindWords();
}

function bindWords() {
    document.querySelectorAll(".word").forEach(function (word) {
        var pinyinText = word.getAttribute("data-pinyin");
        if (pinyinText) {
            var pinyinSpan = document.createElement("span");
            pinyinSpan.className = "pinyin";
            pinyinSpan.textContent = pinyinText;
            word.appendChild(pinyinSpan);
        }
        word.addEventListener("click", function (e) {
            e.stopPropagation();
            this.classList.toggle("revealed");
        });
    });
}

document.addEventListener("click", function () {
    document.querySelectorAll(".word.revealed").forEach(function (w) {
        w.classList.remove("revealed");
    });
});

render();
</script>
</body>
</html>
