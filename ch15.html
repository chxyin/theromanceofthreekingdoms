<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三国演义 · 第十五回 · 点击显示拼音 + 英译</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #f8f5f0;
            font-family: 'Segoe UI', 'Noto Serif SC', 'KaiTi', '楷体', 'Songti SC', serif;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            line-height: 2.2;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: #fffcf8;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            border: 1px solid #e6d9cc;
        }
        h1 {
            font-size: 2.2rem;
            text-align: center;
            color: #5e3e2b;
            letter-spacing: 4px;
            font-weight: 500;
            margin-bottom: 0.5rem;
            border-bottom: 2px solid #d9c6b0;
            padding-bottom: 1.2rem;
        }
        .subhead {
            text-align: center;
            font-size: 1.1rem;
            color: #8b6f55;
            margin-bottom: 1rem;
            letter-spacing: 2px;
            font-style: italic;
        }
        .jumpbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem;
            margin: 1.2rem 0 2.5rem 0;
            padding: 0.9rem;
            background: #f4ebe2;
            border-radius: 14px;
            border: 1px solid #e6d9cc;
        }
        .jumpbar a {
            text-decoration: none;
            font-size: 0.92rem;
            color: #5e3e2b;
            background: #fffcf8;
            border: 1px solid #d9c6b0;
            border-radius: 10px;
            padding: 0.35rem 0.8rem;
            transition: background 0.2s, color 0.2s;
        }
        .jumpbar a:hover { background: #5e3e2b; color: #fff8f0; }
        .chapter-title {
            font-size: 1.6rem;
            text-align: center;
            color: #4a3322;
            margin: 2rem 0 2.5rem 0;
            font-weight: 600;
            letter-spacing: 3px;
            background: linear-gradient(to right, transparent, #efe3d8, transparent);
            padding: 0.8rem 0;
            scroll-margin-top: 1.5rem;
        }
        .chapter-title .eng-title {
            display: block;
            font-size: 1rem;
            font-weight: 400;
            color: #8b6f55;
            letter-spacing: 1px;
            margin-top: 0.4rem;
            font-style: italic;
        }
        .paragraph { margin-bottom: 2.2rem; text-align: justify; }
        .sentence { display: block; margin-bottom: 1.5rem; }
        .zh-line { display: block; margin-bottom: 0.3rem; }
        .word {
            display: inline-block;
            position: relative;
            cursor: pointer;
            font-size: 1.25rem;
            font-family: 'Noto Serif SC', 'KaiTi', serif;
            color: #1f1a15;
            margin: 0 0.05em;
            padding: 0.05em 0.1em;
            border-radius: 4px;
            transition: background-color 0.2s;
            vertical-align: middle;
        }
        .word:hover { background-color: #f0e4d8; }
        .word.revealed {
            background-color: #f4e8dc;
            box-shadow: 0 0 0 1px #d9c6b0;
        }
        .punct {
            font-family: 'Noto Serif SC', 'KaiTi', serif;
            font-size: 1.25rem;
            color: #1f1a15;
            vertical-align: middle;
        }
        .pinyin {
            display: none;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 100%;
            margin-bottom: 2px;
            background-color: #5e3e2b;
            color: #fff8f0;
            font-size: 0.7rem;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            letter-spacing: 0.5px;
            padding: 0.15em 0.5em;
            border-radius: 12px;
            white-space: nowrap;
            z-index: 10;
            line-height: 1.4;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            pointer-events: none;
        }
        .word.revealed .pinyin { display: block; }
        .eng-line {
            display: block;
            font-size: 0.95rem;
            color: #7a6554;
            font-family: 'Segoe UI', 'Georgia', serif;
            line-height: 1.6;
            padding-left: 0.5rem;
            border-left: 2px solid #d9c6b0;
            margin-top: 0.2rem;
            margin-bottom: 0.4rem;
            font-style: italic;
        }
        .note {
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px dashed #cdb9a8;
            font-size: 0.9rem;
            color: #7a5e4b;
            text-align: center;
            font-style: italic;
        }
        .hint {
            text-align: center;
            font-size: 0.85rem;
            color: #a0785a;
            margin-bottom: 1rem;
            font-style: italic;
        }
        @media (max-width: 600px) {
            .container { padding: 1.8rem 1.2rem; }
            h1 { font-size: 1.6rem; letter-spacing: 2px; }
            .word, .punct { font-size: 1.1rem; }
            .chapter-title { font-size: 1.2rem; }
            .eng-line { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>三国演义</h1>
    <div class="subhead">第十五回 · 点击汉字显示拼音 + 英译</div>
    <div class="hint">👆 点击任意汉字即可显示/隐藏其拼音</div>

    <nav class="jumpbar">
        <a href="#s1">太史慈</a>
        <a href="#s2">孙策起兵</a>
        <a href="#s3">神亭之战</a>
        <a href="#s4">收服太史慈</a>
    </nav>

    <div id="story"></div>

    <div class="note">
        —— 第十五回 · 点击汉字显示拼音 + 英译 ——
    </div>
</div>

<script>
const SENTENCES = [
    {
        type: "title",
        zh: "太|tài 史|shǐ 慈|cí 酣|hān 战|zhàn 小|xiǎo 霸|bà 王|wáng · 孙|sūn 伯|bó 符|fú 大|dà 战|zhàn 严|yán 白|bái 虎|hǔ",
        en: "Taishi Ci Fights a Rousing Battle with the Little Tyrant; Sun Bofu Fights a Great Battle with White Tiger Yan"
    },
    {
        type: "para", id: "s1",
        sentences: [
            {
                zh: "孙|sūn 坚|jiān 死|sǐ 后|hòu ，其|qí 子|zǐ 孙|sūn 策|cè 投|tóu 奔|bēn 袁|yuán 术|shù ，屡|lǚ 立|lì 战|zhàn 功|gōng ，却|què 不|bù 得|dé 重|zhòng 用|yòng 。孙|sūn 策|cè 以|yǐ 玉|yù 玺|xǐ 为|wéi 质|zhì ，向|xiàng 袁|yuán 术|shù 借|jiè 兵|bīng ，准|zhǔn 备|bèi 回|huí 江|jiāng 东|dōng 开|kāi 创|chuàng 基|jī 业|yè 。",
                en: "After Sun Jian's death, his son Sun Ce sought service under Yuan Shu and repeatedly earned merit, yet was never given important command. Sun Ce used the Imperial Seal as collateral to borrow troops from Yuan Shu, preparing to return to Jiangdong and build his own foundation."
            }
        ]
    },
    {
        type: "para", id: "s2",
        sentences: [
            {
                zh: "孙|sūn 策|cè 率|shuài 领|lǐng 旧|jiù 部|bù 渡|dù 江|jiāng ，一|yī 路|lù 招|zhāo 兵|bīng 买|mǎi 马|mǎ ，声|shēng 势|shì 渐|jiàn 大|dà 。他|tā 先|xiān 攻|gōng 刘|liú 繇|yáo ，再|zài 取|qǔ 严|yán 白|bái 虎|hǔ ，江|jiāng 东|dōng 豪|háo 杰|jié 纷|fēn 纷|fēn 来|lái 投|tóu 。",
                en: "Sun Ce led his old followers across the river, recruiting soldiers and buying horses along the way, and his forces grew steadily. He first attacked Liu Yao, then dealt with White Tiger Yan, and heroes of Jiangdong came flocking to join him."
            }
        ]
    },
    {
        type: "para", id: "s3",
        sentences: [
            {
                zh: "孙|sūn 策|cè 与|yǔ 太|tài 史|shǐ 慈|cí 在|zài 神|shén 亭|tíng 相|xiāng 遇|yù ，两|liǎng 人|rén 大|dà 战|zhàn 数|shù 十|shí 合|hé ，不|bù 分|fēn 胜|shèng 负|fù 。孙|sūn 策|cè 夺|duó 得|de 太|tài 史|shǐ 慈|cí 短|duǎn 戟|jǐ ，太|tài 史|shǐ 慈|cí 抢|qiǎng 得|de 孙|sūn 策|cè 头|tóu 盔|kuī ，彼|bǐ 此|cǐ 佩|pèi 服|fú 。",
                en: "Sun Ce and Taishi Ci met at Shenting and fought dozens of bouts without deciding victory. Sun Ce seized Taishi Ci's short halberd, and Taishi Ci snatched Sun Ce's helmet; each came to admire the other."
            }
        ]
    },
    {
        type: "para", id: "s4",
        sentences: [
            {
                zh: "后|hòu 来|lái 太|tài 史|shǐ 慈|cí 兵|bīng 败|bài 被|bèi 擒|qín ，孙|sūn 策|cè 亲|qīn 解|jiě 其|qí 缚|fù ，以|yǐ 礼|lǐ 相|xiāng 待|dài 。太|tài 史|shǐ 慈|cí 感|gǎn 其|qí 恩|ēn 义|yì ，遂|suì 归|guī 顺|shùn 孙|sūn 策|cè ，成|chéng 为|wéi 江|jiāng 东|dōng 名|míng 将|jiàng 。",
                en: "Later Taishi Ci was defeated and captured. Sun Ce personally untied him and treated him with courtesy. Moved by Sun Ce's kindness, Taishi Ci submitted to him and became a famous general of Jiangdong."
            }
        ]
    }
];

function tokenToHtml(tok) {
    if (tok.startsWith("RAW")) return tok.slice(3);
    if (tok.includes("|")) {
        const [ch, py] = tok.split("|");
        return `<span class="word" data-pinyin="${py}">${ch}</span>`;
    }
    return `<span class="punct">${tok}</span>`;
}

function renderZh(zh) {
    return zh.split(/\s+/).filter(Boolean).map(tokenToHtml).join("");
}

function renderSentence(s) {
    return `<div class="sentence">
        <span class="zh-line">${renderZh(s.zh)}</span>
        <span class="eng-line">${s.en}</span>
    </div>`;
}

function render() {
    const root = document.getElementById("story");
    let html = "";
    for (const block of SENTENCES) {
        if (block.type === "title") {
            html += `<div class="chapter-title">${renderZh(block.zh)}<span class="eng-title">${block.en}</span></div>`;
        } else if (block.type === "para") {
            html += `<div class="paragraph"${block.id ? ` id="${block.id}"` : ""}>${block.sentences.map(renderSentence).join("")}</div>`;
        }
    }
    root.innerHTML = html;
    bindWords();
}

function bindWords() {
    document.querySelectorAll(".word").forEach(function (word) {
        var pinyinText = word.getAttribute("data-pinyin");
        if (pinyinText) {
            var pinyinSpan = document.createElement("span");
            pinyinSpan.className = "pinyin";
            pinyinSpan.textContent = pinyinText;
            word.appendChild(pinyinSpan);
        }
        word.addEventListener("click", function (e) {
            e.stopPropagation();
            this.classList.toggle("revealed");
        });
    });
}

document.addEventListener("click", function () {
    document.querySelectorAll(".word.revealed").forEach(function (w) {
        w.classList.remove("revealed");
    });
});

render();
</script>
</body>
</html>
