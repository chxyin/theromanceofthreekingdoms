<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三国演义 · 第七回 · 点击显示拼音 + 英译</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #f8f5f0;
            font-family: 'Segoe UI', 'Noto Serif SC', 'KaiTi', '楷体', 'Songti SC', serif;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            line-height: 2.2;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: #fffcf8;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            border: 1px solid #e6d9cc;
        }
        h1 {
            font-size: 2.2rem;
            text-align: center;
            color: #5e3e2b;
            letter-spacing: 4px;
            font-weight: 500;
            margin-bottom: 0.5rem;
            border-bottom: 2px solid #d9c6b0;
            padding-bottom: 1.2rem;
        }
        .subhead {
            text-align: center;
            font-size: 1.1rem;
            color: #8b6f55;
            margin-bottom: 1rem;
            letter-spacing: 2px;
            font-style: italic;
        }
        .jumpbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem;
            margin: 1.2rem 0 2.5rem 0;
            padding: 0.9rem;
            background: #f4ebe2;
            border-radius: 14px;
            border: 1px solid #e6d9cc;
        }
        .jumpbar a {
            text-decoration: none;
            font-size: 0.92rem;
            color: #5e3e2b;
            background: #fffcf8;
            border: 1px solid #d9c6b0;
            border-radius: 10px;
            padding: 0.35rem 0.8rem;
            transition: background 0.2s, color 0.2s;
        }
        .jumpbar a:hover { background: #5e3e2b; color: #fff8f0; }
        .chapter-title {
            font-size: 1.6rem;
            text-align: center;
            color: #4a3322;
            margin: 2rem 0 2.5rem 0;
            font-weight: 600;
            letter-spacing: 3px;
            background: linear-gradient(to right, transparent, #efe3d8, transparent);
            padding: 0.8rem 0;
            scroll-margin-top: 1.5rem;
        }
        .chapter-title .eng-title {
            display: block;
            font-size: 1rem;
            font-weight: 400;
            color: #8b6f55;
            letter-spacing: 1px;
            margin-top: 0.4rem;
            font-style: italic;
        }
        .paragraph { margin-bottom: 2.2rem; text-align: justify; }
        .sentence { display: block; margin-bottom: 1.5rem; }
        .zh-line { display: block; margin-bottom: 0.3rem; }
        .word {
            display: inline-block;
            position: relative;
            cursor: pointer;
            font-size: 1.25rem;
            font-family: 'Noto Serif SC', 'KaiTi', serif;
            color: #1f1a15;
            margin: 0 0.05em;
            padding: 0.05em 0.1em;
            border-radius: 4px;
            transition: background-color 0.2s;
            vertical-align: middle;
        }
        .word:hover { background-color: #f0e4d8; }
        .word.revealed {
            background-color: #f4e8dc;
            box-shadow: 0 0 0 1px #d9c6b0;
        }
        .punct {
            font-family: 'Noto Serif SC', 'KaiTi', serif;
            font-size: 1.25rem;
            color: #1f1a15;
            vertical-align: middle;
        }
        .pinyin {
            display: none;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 100%;
            margin-bottom: 2px;
            background-color: #5e3e2b;
            color: #fff8f0;
            font-size: 0.7rem;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            letter-spacing: 0.5px;
            padding: 0.15em 0.5em;
            border-radius: 12px;
            white-space: nowrap;
            z-index: 10;
            line-height: 1.4;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            pointer-events: none;
        }
        .word.revealed .pinyin { display: block; }
        .eng-line {
            display: block;
            font-size: 0.95rem;
            color: #7a6554;
            font-family: 'Segoe UI', 'Georgia', serif;
            line-height: 1.6;
            padding-left: 0.5rem;
            border-left: 2px solid #d9c6b0;
            margin-top: 0.2rem;
            margin-bottom: 0.4rem;
            font-style: italic;
        }
        .note {
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px dashed #cdb9a8;
            font-size: 0.9rem;
            color: #7a5e4b;
            text-align: center;
            font-style: italic;
        }
        .hint {
            text-align: center;
            font-size: 0.85rem;
            color: #a0785a;
            margin-bottom: 1rem;
            font-style: italic;
        }
        @media (max-width: 600px) {
            .container { padding: 1.8rem 1.2rem; }
            h1 { font-size: 1.6rem; letter-spacing: 2px; }
            .word, .punct { font-size: 1.1rem; }
            .chapter-title { font-size: 1.2rem; }
            .eng-line { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>三国演义</h1>
    <div class="subhead">第七回 · 点击汉字显示拼音 + 英译</div>
    <div class="hint">👆 点击任意汉字即可显示/隐藏其拼音</div>

    <nav class="jumpbar">
        <a href="#s1">袁绍</a>
        <a href="#s2">孙坚</a>
        <a href="#s3">跨江</a>
    </nav>

    <div id="story"></div>

    <div class="note">
        —— 第七回 · 点击汉字显示拼音 + 英译 ——
    </div>
</div>

<script>
const SENTENCES = [
    {
        type: "title",
        zh: "袁|yuán 绍|shào 磐|pán 河|hé 战|zhàn 公|gōng 孙|sūn 瓒|zàn · 孙|sūn 坚|jiān 跨|kuà 江|jiāng 击|jī 刘|liú 表|biǎo",
        en: "Yuan Shao Fights Gongsun Zan at the Pan River; Sun Jian Crosses the River to Attack Liu Biao"
    },
    {
        type: "para", id: "s1",
        sentences: [
            {
                zh: "袁|yuán 绍|shào 与|yǔ 公|gōng 孙|sūn 瓒|zàn 因|yīn 争|zhēng 夺|duó 冀|jì 州|zhōu 而|ér 交|jiāo 恶|è ，两|liǎng 军|jūn 大|dà 战|zhàn 于|yú 磐|pán 河|hé 。公|gōng 孙|sūn 瓒|zàn 兵|bīng 败|bài ，被|bèi 袁|yuán 绍|shào 部|bù 将|jiàng 文|wén 丑|chǒu 追|zhuī 杀|shā ，幸|xìng 得|dé 赵|zhào 云|yún 相|xiāng 救|jiù ，方|fāng 得|dé 脱|tuō 身|shēn 。",
                en: "Yuan Shao and Gongsun Zan fell out over control of Jizhou and fought a great battle at the Pan River. Gongsun Zan's forces were defeated, and he was pursued by Yuan Shao's general Wen Chou; he escaped only because Zhao Yun came to his rescue."
            },
            {
                zh: "赵|zhào 云|yún 勇|yǒng 猛|měng 过|guò 人|rén ，公|gōng 孙|sūn 瓒|zàn 甚|shèn 爱|ài 之|zhī 。此|zǐ 后|hòu 袁|yuán 绍|shào 势|shì 力|lì 渐|jiàn 强|qiáng ，雄|xióng 踞|jù 河|hé 北|běi 。",
                en: "Zhao Yun was exceptionally brave, and Gongsun Zan greatly admired him. After this, Yuan Shao's power gradually grew, and he dominated the region north of the Yellow River."
            }
        ]
    },
    {
        type: "para", id: "s2",
        sentences: [
            {
                zh: "孙|sūn 坚|jiān 私|sī 藏|cáng 玉|yù 玺|xǐ 归|guī 江|jiāng 东|dōng ，袁|yuán 绍|shào 怀|huái 恨|hèn ，暗|àn 令|lìng 荆|jīng 州|zhōu 刺|cì 史|shǐ 刘|liú 表|biǎo 于|yú 路|lù 上|shàng 截|jié 击|jī 。孙|sūn 坚|jiān 中|zhòng 伏|fú ，损|sǔn 兵|bīng 折|zhé 将|jiàng ，与|yǔ 刘|liú 表|biǎo 结|jié 下|xià 深|shēn 仇|chóu 。",
                en: "Sun Jian returned to Jiangdong with the Imperial Seal hidden, and Yuan Shao harbored a grudge. Yuan Shao secretly ordered Liu Biao, the Inspector of Jingzhou, to intercept Sun Jian on the road. Sun Jian fell into an ambush, lost many men, and became sworn enemies with Liu Biao."
            }
        ]
    },
    {
        type: "para", id: "s3",
        sentences: [
            {
                zh: "孙|sūn 坚|jiān 誓|shì 报|bào 此|zhǐ 仇|chóu ，亲|qīn 率|shuài 大|dà 军|jūn 跨|kuà 江|jiāng 攻|gōng 打|dǎ 荆|jīng 州|zhōu 。刘|liú 表|biǎo 派|pài 黄|huáng 祖|zǔ 迎|yíng 战|zhàn ，屡|lǚ 战|zhàn 屡|lǚ 败|bài 。孙|sūn 坚|jiān 乘|chéng 胜|shèng 追|zhuī 击|jī ，不|bù 料|liào 中|zhòng 了|le 埋|mái 伏|fú ，被|bèi 乱|luàn 箭|jiàn 射|shè 死|sǐ 。",
                en: "Sun Jian swore to avenge this wrong and personally led a great army across the river to attack Jingzhou. Liu Biao sent Huang Zu to meet him, but Huang Zu was defeated again and again. Sun Jian pursued the retreating enemy in triumph, but unexpectedly fell into an ambush and was killed by a hail of arrows."
            },
            {
                zh: "孙|sūn 坚|jiān 死|sǐ 后|hòu ，其|qí 子|zǐ 孙|sūn 策|cè 、孙|sūn 权|quán 尚|shàng 幼|yòu ，江|jiāng 东|dōng 基|jī 业|yè 暂|zàn 由|yóu 部|bù 属|shǔ 维|wéi 持|chí 。",
                en: "After Sun Jian's death, his sons Sun Ce and Sun Quan were still young, and the Jiangdong enterprise was temporarily sustained by his subordinates."
            }
        ]
    }
];

function tokenToHtml(tok) {
    if (tok.startsWith("RAW")) return tok.slice(3);
    if (tok.includes("|")) {
        const [ch, py] = tok.split("|");
        return `<span class="word" data-pinyin="${py}">${ch}</span>`;
    }
    return `<span class="punct">${tok}</span>`;
}

function renderZh(zh) {
    return zh.split(/\s+/).filter(Boolean).map(tokenToHtml).join("");
}

function renderSentence(s) {
    return `<div class="sentence">
        <span class="zh-line">${renderZh(s.zh)}</span>
        <span class="eng-line">${s.en}</span>
    </div>`;
}

function render() {
    const root = document.getElementById("story");
    let html = "";
    for (const block of SENTENCES) {
        if (block.type === "title") {
            html += `<div class="chapter-title">${renderZh(block.zh)}<span class="eng-title">${block.en}</span></div>`;
        } else if (block.type === "para") {
            html += `<div class="paragraph"${block.id ? ` id="${block.id}"` : ""}>${block.sentences.map(renderSentence).join("")}</div>`;
        }
    }
    root.innerHTML = html;
    bindWords();
}

function bindWords() {
    document.querySelectorAll(".word").forEach(function (word) {
        var pinyinText = word.getAttribute("data-pinyin");
        if (pinyinText) {
            var pinyinSpan = document.createElement("span");
            pinyinSpan.className = "pinyin";
            pinyinSpan.textContent = pinyinText;
            word.appendChild(pinyinSpan);
        }
        word.addEventListener("click", function (e) {
            e.stopPropagation();
            this.classList.toggle("revealed");
        });
    });
}

document.addEventListener("click", function () {
    document.querySelectorAll(".word.revealed").forEach(function (w) {
        w.classList.remove("revealed");
    });
});

render();
</script>
</body>
</html>
