<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三国演义 · 第十八回 · 点击显示拼音 + 英译</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #f8f5f0;
            font-family: 'Segoe UI', 'Noto Serif SC', 'KaiTi', '楷体', 'Songti SC', serif;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            line-height: 2.2;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: #fffcf8;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            border: 1px solid #e6d9cc;
        }
        h1 {
            font-size: 2.2rem;
            text-align: center;
            color: #5e3e2b;
            letter-spacing: 4px;
            font-weight: 500;
            margin-bottom: 0.5rem;
            border-bottom: 2px solid #d9c6b0;
            padding-bottom: 1.2rem;
        }
        .subhead {
            text-align: center;
            font-size: 1.1rem;
            color: #8b6f55;
            margin-bottom: 1rem;
            letter-spacing: 2px;
            font-style: italic;
        }
        .jumpbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem;
            margin: 1.2rem 0 2.5rem 0;
            padding: 0.9rem;
            background: #f4ebe2;
            border-radius: 14px;
            border: 1px solid #e6d9cc;
        }
        .jumpbar a {
            text-decoration: none;
            font-size: 0.92rem;
            color: #5e3e2b;
            background: #fffcf8;
            border: 1px solid #d9c6b0;
            border-radius: 10px;
            padding: 0.35rem 0.8rem;
            transition: background 0.2s, color 0.2s;
        }
        .jumpbar a:hover { background: #5e3e2b; color: #fff8f0; }
        .chapter-title {
            font-size: 1.6rem;
            text-align: center;
            color: #4a3322;
            margin: 2rem 0 2.5rem 0;
            font-weight: 600;
            letter-spacing: 3px;
            background: linear-gradient(to right, transparent, #efe3d8, transparent);
            padding: 0.8rem 0;
            scroll-margin-top: 1.5rem;
        }
        .chapter-title .eng-title {
            display: block;
            font-size: 1rem;
            font-weight: 400;
            color: #8b6f55;
            letter-spacing: 1px;
            margin-top: 0.4rem;
            font-style: italic;
        }
        .paragraph { margin-bottom: 2.2rem; text-align: justify; }
        .sentence { display: block; margin-bottom: 1.5rem; }
        .zh-line { display: block; margin-bottom: 0.3rem; }
        .word {
            display: inline-block;
            position: relative;
            cursor: pointer;
            font-size: 1.25rem;
            font-family: 'Noto Serif SC', 'KaiTi', serif;
            color: #1f1a15;
            margin: 0 0.05em;
            padding: 0.05em 0.1em;
            border-radius: 4px;
            transition: background-color 0.2s;
            vertical-align: middle;
        }
        .word:hover { background-color: #f0e4d8; }
        .word.revealed {
            background-color: #f4e8dc;
            box-shadow: 0 0 0 1px #d9c6b0;
        }
        .punct {
            font-family: 'Noto Serif SC', 'KaiTi', serif;
            font-size: 1.25rem;
            color: #1f1a15;
            vertical-align: middle;
        }
        .pinyin {
            display: none;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 100%;
            margin-bottom: 2px;
            background-color: #5e3e2b;
            color: #fff8f0;
            font-size: 0.7rem;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            letter-spacing: 0.5px;
            padding: 0.15em 0.5em;
            border-radius: 12px;
            white-space: nowrap;
            z-index: 10;
            line-height: 1.4;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            pointer-events: none;
        }
        .word.revealed .pinyin { display: block; }
        .eng-line {
            display: block;
            font-size: 0.95rem;
            color: #7a6554;
            font-family: 'Segoe UI', 'Georgia', serif;
            line-height: 1.6;
            padding-left: 0.5rem;
            border-left: 2px solid #d9c6b0;
            margin-top: 0.2rem;
            margin-bottom: 0.4rem;
            font-style: italic;
        }
        .note {
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px dashed #cdb9a8;
            font-size: 0.9rem;
            color: #7a5e4b;
            text-align: center;
            font-style: italic;
        }
        .hint {
            text-align: center;
            font-size: 0.85rem;
            color: #a0785a;
            margin-bottom: 1rem;
            font-style: italic;
        }
        @media (max-width: 600px) {
            .container { padding: 1.8rem 1.2rem; }
            h1 { font-size: 1.6rem; letter-spacing: 2px; }
            .word, .punct { font-size: 1.1rem; }
            .chapter-title { font-size: 1.2rem; }
            .eng-line { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>三国演义</h1>
    <div class="subhead">第十八回 · 点击汉字显示拼音 + 英译</div>
    <div class="hint">👆 点击任意汉字即可显示/隐藏其拼音</div>

    <nav class="jumpbar">
        <a href="#s1">贾诩论将</a>
        <a href="#s2">夏侯惇失目</a>
        <a href="#s3">曹操断粮</a>
        <a href="#s4">借刀杀人</a>
    </nav>

    <div id="story"></div>

    <div class="note">
        —— 第十八回 · 点击汉字显示拼音 + 英译 ——
    </div>
</div>

<script>
const SENTENCES = [
    {
        type: "title",
        zh: "贾|jiǎ 文|wén 和|hé 料|liào 敌|dí 决|jué 胜|shèng · 夏|xià 侯|hóu 惇|dūn 拔|bá 矢|shǐ 啖|dàn 睛|jīng",
        en: "Jia Wenhe Sizes Up the Enemy and Decides Victory; Xiahou Dun Pulls Out the Arrow and Eats His Eye"
    },
    {
        type: "para", id: "s1",
        sentences: [
            {
                zh: "曹|cáo 操|cāo 与|yǔ 张|zhāng 绣|xiù 、刘|liú 表|biǎo 联|lián 军|jūn 对|duì 峙|zhì 。贾|jiǎ 诩|xǔ 对|duì 张|zhāng 绣|xiù 说|shuō ：“曹|cáo 操|cāo 用|yòng 兵|bīng 如|rú 神|shén ，不|bù 可|kě 轻|qīng 敌|dí ，须|xū 以|yǐ 计|jì 破|pò 之|zhī 。”张|zhāng 绣|xiù 依|yī 计|jì 而|ér 行|xíng 。",
                en: "Cao Cao faced the allied forces of Zhang Xiu and Liu Biao. Jia Xu told Zhang Xiu: \"Cao Cao wields troops like a god—he must not be taken lightly. We must defeat him by stratagem.\" Zhang Xiu acted on his advice."
            }
        ]
    },
    {
        type: "para", id: "s2",
        sentences: [
            {
                zh: "曹|cáo 操|cāo 派|pài 夏|xià 侯|hóu 惇|dūn 迎|yíng 战|zhàn 吕|lǚ 布|bù 部|bù 将|jiàng 高|gāo 顺|shùn 。高|gāo 顺|shùn 诈|zhà 败|bài ，夏|xià 侯|hóu 惇|dūn 追|zhuī 赶|gǎn 中|zhòng 伏|fú ，被|bèi 冷|lěng 箭|jiàn 射|shè 中|zhòng 左|zuǒ 目|mù 。夏|xià 侯|hóu 惇|dūn 大|dà 呼|hū ：“父|fù 精|jīng 母|mǔ 血|xuě ，不|bù 可|kě 弃|qì 也|yě ！”遂|suì 拔|bá 箭|jiàn 啖|dàn 睛|jīng ，仍|réng 挺|tǐng 枪|qiāng 杀|shā 敌|dí ，勇|yǒng 冠|guān 三|sān 军|jūn 。",
                en: "Cao Cao sent Xiahou Dun to meet Lü Bu's officer Gao Shun. Gao Shun feigned defeat, and Xiahou Dun pursued into an ambush, where a stray arrow struck his left eye. Xiahou Dun cried out: \"This is the essence of my father and mother—I cannot throw it away!\" He pulled out the arrow and swallowed his eye, then fought on with his spear, his valor topping the three armies."
            }
        ]
    },
    {
        type: "para", id: "s3",
        sentences: [
            {
                zh: "曹|cáo 操|cāo 军|jūn 中|zhōng 粮|liáng 草|cǎo 不|bù 足|zú ，向|xiàng 孙|sūn 策|cè 借|jiè 粮|liáng 。孙|sūn 策|cè 送|sòng 粮|liáng 十|shí 万|wàn 斛|hú ，曹|cáo 操|cāo 军|jūn 心|xīn 大|dà 定|dìng 。袁|yuán 术|shù 势|shì 力|lì 日|rì 衰|shuāi ，部|bù 下|xià 离|lí 心|xīn 。",
                en: "Cao Cao's army was short of grain and borrowed supplies from Sun Ce. Sun Ce sent a hundred thousand bushels of grain, and Cao Cao's troops were greatly heartened. Yuan Shu's power waned by the day, and his subordinates grew disloyal."
            }
        ]
    },
    {
        type: "para", id: "s4",
        sentences: [
            {
                zh: "曹|cáo 操|cāo 采|cǎi 纳|nà 荀|xún 彧|yù 之|zhī 计|jì ，以|yǐ 天|tiān 子|zǐ 诏|zhào 书|shū 密|mì 令|lìng 刘|liú 备|bèi 图|tú 吕|lǚ 布|bù ，欲|yù 借|jiè 刀|dāo 杀|shā 人|rén 。刘|liú 备|bèi 不|bù 忍|rěn 加|jiā 害|hài ，反|fǎn 将|jiāng 密|mì 信|xìn 示|shì 于|yú 吕|lǚ 布|bù ，吕|lǚ 布|bù 感|gǎn 其|qí 情|qíng 义|yì 。",
                en: "Cao Cao adopted Xun Yu's plan and sent a secret imperial edict ordering Liu Bei to move against Lü Bu, hoping to kill with a borrowed knife. Liu Bei could not bear to harm him and instead showed the secret letter to Lü Bu, who was moved by his loyalty."
            }
        ]
    }
];

function tokenToHtml(tok) {
    if (tok.startsWith("RAW")) return tok.slice(3);
    if (tok.includes("|")) {
        const [ch, py] = tok.split("|");
        return `<span class="word" data-pinyin="${py}">${ch}</span>`;
    }
    return `<span class="punct">${tok}</span>`;
}

function renderZh(zh) {
    return zh.split(/\s+/).filter(Boolean).map(tokenToHtml).join("");
}

function renderSentence(s) {
    return `<div class="sentence">
        <span class="zh-line">${renderZh(s.zh)}</span>
        <span class="eng-line">${s.en}</span>
    </div>`;
}

function render() {
    const root = document.getElementById("story");
    let html = "";
    for (const block of SENTENCES) {
        if (block.type === "title") {
            html += `<div class="chapter-title">${renderZh(block.zh)}<span class="eng-title">${block.en}</span></div>`;
        } else if (block.type === "para") {
            html += `<div class="paragraph"${block.id ? ` id="${block.id}"` : ""}>${block.sentences.map(renderSentence).join("")}</div>`;
        }
    }
    root.innerHTML = html;
    bindWords();
}

function bindWords() {
    document.querySelectorAll(".word").forEach(function (word) {
        var pinyinText = word.getAttribute("data-pinyin");
        if (pinyinText) {
            var pinyinSpan = document.createElement("span");
            pinyinSpan.className = "pinyin";
            pinyinSpan.textContent = pinyinText;
            word.appendChild(pinyinSpan);
        }
        word.addEventListener("click", function (e) {
            e.stopPropagation();
            this.classList.toggle("revealed");
        });
    });
}

document.addEventListener("click", function () {
    document.querySelectorAll(".word.revealed").forEach(function (w) {
        w.classList.remove("revealed");
    });
});

render();
</script>
</body>
</html>
