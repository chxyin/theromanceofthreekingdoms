<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三国演义 · 第十三回 · 点击显示拼音 + 英译</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #f8f5f0;
            font-family: 'Segoe UI', 'Noto Serif SC', 'KaiTi', '楷体', 'Songti SC', serif;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            line-height: 2.2;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: #fffcf8;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            border: 1px solid #e6d9cc;
        }
        h1 {
            font-size: 2.2rem;
            text-align: center;
            color: #5e3e2b;
            letter-spacing: 4px;
            font-weight: 500;
            margin-bottom: 0.5rem;
            border-bottom: 2px solid #d9c6b0;
            padding-bottom: 1.2rem;
        }
        .subhead {
            text-align: center;
            font-size: 1.1rem;
            color: #8b6f55;
            margin-bottom: 1rem;
            letter-spacing: 2px;
            font-style: italic;
        }
        .jumpbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem;
            margin: 1.2rem 0 2.5rem 0;
            padding: 0.9rem;
            background: #f4ebe2;
            border-radius: 14px;
            border: 1px solid #e6d9cc;
        }
        .jumpbar a {
            text-decoration: none;
            font-size: 0.92rem;
            color: #5e3e2b;
            background: #fffcf8;
            border: 1px solid #d9c6b0;
            border-radius: 10px;
            padding: 0.35rem 0.8rem;
            transition: background 0.2s, color 0.2s;
        }
        .jumpbar a:hover { background: #5e3e2b; color: #fff8f0; }
        .chapter-title {
            font-size: 1.6rem;
            text-align: center;
            color: #4a3322;
            margin: 2rem 0 2.5rem 0;
            font-weight: 600;
            letter-spacing: 3px;
            background: linear-gradient(to right, transparent, #efe3d8, transparent);
            padding: 0.8rem 0;
            scroll-margin-top: 1.5rem;
        }
        .chapter-title .eng-title {
            display: block;
            font-size: 1rem;
            font-weight: 400;
            color: #8b6f55;
            letter-spacing: 1px;
            margin-top: 0.4rem;
            font-style: italic;
        }
        .paragraph { margin-bottom: 2.2rem; text-align: justify; }
        .sentence { display: block; margin-bottom: 1.5rem; }
        .zh-line { display: block; margin-bottom: 0.3rem; }
        .word {
            display: inline-block;
            position: relative;
            cursor: pointer;
            font-size: 1.25rem;
            font-family: 'Noto Serif SC', 'KaiTi', serif;
            color: #1f1a15;
            margin: 0 0.05em;
            padding: 0.05em 0.1em;
            border-radius: 4px;
            transition: background-color 0.2s;
            vertical-align: middle;
        }
        .word:hover { background-color: #f0e4d8; }
        .word.revealed {
            background-color: #f4e8dc;
            box-shadow: 0 0 0 1px #d9c6b0;
        }
        .punct {
            font-family: 'Noto Serif SC', 'KaiTi', serif;
            font-size: 1.25rem;
            color: #1f1a15;
            vertical-align: middle;
        }
        .pinyin {
            display: none;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 100%;
            margin-bottom: 2px;
            background-color: #5e3e2b;
            color: #fff8f0;
            font-size: 0.7rem;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            letter-spacing: 0.5px;
            padding: 0.15em 0.5em;
            border-radius: 12px;
            white-space: nowrap;
            z-index: 10;
            line-height: 1.4;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            pointer-events: none;
        }
        .word.revealed .pinyin { display: block; }
        .eng-line {
            display: block;
            font-size: 0.95rem;
            color: #7a6554;
            font-family: 'Segoe UI', 'Georgia', serif;
            line-height: 1.6;
            padding-left: 0.5rem;
            border-left: 2px solid #d9c6b0;
            margin-top: 0.2rem;
            margin-bottom: 0.4rem;
            font-style: italic;
        }
        .note {
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px dashed #cdb9a8;
            font-size: 0.9rem;
            color: #7a5e4b;
            text-align: center;
            font-style: italic;
        }
        .hint {
            text-align: center;
            font-size: 0.85rem;
            color: #a0785a;
            margin-bottom: 1rem;
            font-style: italic;
        }
        @media (max-width: 600px) {
            .container { padding: 1.8rem 1.2rem; }
            h1 { font-size: 1.6rem; letter-spacing: 2px; }
            .word, .punct { font-size: 1.1rem; }
            .chapter-title { font-size: 1.2rem; }
            .eng-line { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>三国演义</h1>
    <div class="subhead">第十三回 · 点击汉字显示拼音 + 英译</div>
    <div class="hint">👆 点击任意汉字即可显示/隐藏其拼音</div>

    <nav class="jumpbar">
        <a href="#s1">李郭内讧</a>
        <a href="#s2">献帝东迁</a>
        <a href="#s3">曹操迎驾</a>
    </nav>

    <div id="story"></div>

    <div class="note">
        —— 第十三回 · 点击汉字显示拼音 + 英译 ——
    </div>
</div>

<script>
const SENTENCES = [
    {
        type: "title",
        zh: "李|lǐ 傕|què 郭|guō 汜|sì 大|dà 交|jiāo 兵|bīng · 杨|yáng 奉|fèng 董|dǒng 承|chéng 双|shuāng 救|jiù 驾|jià",
        en: "Li Jue and Guo Si Wage Great War; Yang Feng and Dong Cheng Both Rescue the Emperor"
    },
    {
        type: "para", id: "s1",
        sentences: [
            {
                zh: "李|lǐ 傕|què 与|yǔ 郭|guō 汜|sì 本|běn 是|shì 同|tóng 党|dǎng ，后|hòu 因|yīn 争|zhēng 权|quán 而|ér 反|fǎn 目|mù ，各|gè 拥|yōng 重|zhòng 兵|bīng ，在|zài 长|cháng 安|ān 城|chéng 中|zhōng 大|dà 战|zhàn 。百|bǎi 姓|xìng 遭|zāo 殃|yāng ，死|sǐ 伤|shāng 无|wú 数|shù 。",
                en: "Li Jue and Guo Si had once been allies, but fell out over power and each commanded a large army, fighting a great battle within Chang'an. The common people suffered terribly, with countless dead and wounded."
            },
            {
                zh: "汉|hàn 献|xiàn 帝|dì 被|bèi 困|kùn 宫|gōng 中|zhōng ，粮|liáng 食|shí 断|duàn 绝|jué ，苦|kǔ 不|bù 堪|kān 言|yán 。骑|qí 都|dū 尉|wèi 杨|yáng 奉|fèng 、国|guó 舅|jiù 董|dǒng 承|chéng 设|shè 法|fǎ 保|bǎo 护|hù 献|xiàn 帝|dì ，伺|cì 机|jī 东|dōng 迁|qiān 。",
                en: "Emperor Xian was trapped in the palace, food supplies cut off, in unbearable misery. Yang Feng, a Cavalry Commandant, and Dong Cheng, the Emperor's uncle by marriage, did what they could to protect the Emperor and watched for a chance to move east."
            }
        ]
    },
    {
        type: "para", id: "s2",
        sentences: [
            {
                zh: "杨|yáng 奉|fèng 、董|dǒng 承|chéng 保|bǎo 护|hù 献|xiàn 帝|dì 与|yǔ 百|bǎi 官|guān 逃|táo 出|chū 长|cháng 安|ān ，一|yī 路|lù 艰|jiān 辛|xīn ，奔|bēn 向|xiàng 洛|luò 阳|yáng 。李|lǐ 傕|què 、郭|guō 汜|sì 发|fā 觉|jué 后|hòu 派|pài 兵|bīng 追|zhuī 赶|gǎn ，献|xiàn 帝|dì 一|yī 行|xíng 狼|láng 狈|bèi 不|bù 堪|kān 。",
                en: "Yang Feng and Dong Cheng escorted Emperor Xian and the officials out of Chang'an on a hard journey toward Luoyang. When Li Jue and Guo Si discovered this, they sent troops in pursuit, and the Emperor's party was reduced to a desperate scramble."
            }
        ]
    },
    {
        type: "para", id: "s3",
        sentences: [
            {
                zh: "曹|cáo 操|cāo 在|zài 兖|yǎn 州|zhōu 闻|wén 献|xiàn 帝|dì 东|dōng 归|guī ，采|cǎi 纳|nà 荀|xún 彧|yù “奉|fèng 天|tiān 子|zǐ 以|yǐ 令|lìng 诸|zhū 侯|hóu ”之|zhī 策|cè ，亲|qīn 率|shuài 大|dà 军|jūn 前|qián 往|wǎng 迎|yíng 驾|jià 。曹|cáo 操|cāo 击|jī 退|tuì 追|zhuī 兵|bīng ，将|jiāng 献|xiàn 帝|dì 迎|yíng 入|rù 许|jú 都|dū ，自|zì 此|cǐ 挟|xié 天|tiān 子|zǐ 以|yǐ 号|hào 令|lìng 天|tiān 下|xià 。",
                en: "When Cao Cao in Yanzhou learned that Emperor Xian was returning east, he adopted Xun Yu's strategy of \"supporting the Emperor to command the lords\" and personally led a great army to welcome the Emperor. Cao Cao drove off the pursuing troops and brought Emperor Xian to Xudu, and from then on he controlled the Emperor to issue orders to the realm."
            }
        ]
    }
];

function tokenToHtml(tok) {
    if (tok.startsWith("RAW")) return tok.slice(3);
    if (tok.includes("|")) {
        const [ch, py] = tok.split("|");
        return `<span class="word" data-pinyin="${py}">${ch}</span>`;
    }
    return `<span class="punct">${tok}</span>`;
}

function renderZh(zh) {
    return zh.split(/\s+/).filter(Boolean).map(tokenToHtml).join("");
}

function renderSentence(s) {
    return `<div class="sentence">
        <span class="zh-line">${renderZh(s.zh)}</span>
        <span class="eng-line">${s.en}</span>
    </div>`;
}

function render() {
    const root = document.getElementById("story");
    let html = "";
    for (const block of SENTENCES) {
        if (block.type === "title") {
            html += `<div class="chapter-title">${renderZh(block.zh)}<span class="eng-title">${block.en}</span></div>`;
        } else if (block.type === "para") {
            html += `<div class="paragraph"${block.id ? ` id="${block.id}"` : ""}>${block.sentences.map(renderSentence).join("")}</div>`;
        }
    }
    root.innerHTML = html;
    bindWords();
}

function bindWords() {
    document.querySelectorAll(".word").forEach(function (word) {
        var pinyinText = word.getAttribute("data-pinyin");
        if (pinyinText) {
            var pinyinSpan = document.createElement("span");
            pinyinSpan.className = "pinyin";
            pinyinSpan.textContent = pinyinText;
            word.appendChild(pinyinSpan);
        }
        word.addEventListener("click", function (e) {
            e.stopPropagation();
            this.classList.toggle("revealed");
        });
    });
}

document.addEventListener("click", function () {
    document.querySelectorAll(".word.revealed").forEach(function (w) {
        w.classList.remove("revealed");
    });
});

render();
</script>
</body>
</html>
