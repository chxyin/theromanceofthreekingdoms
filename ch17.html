<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三国演义 · 第十七回 · 点击显示拼音 + 英译</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #f8f5f0;
            font-family: 'Segoe UI', 'Noto Serif SC', 'KaiTi', '楷体', 'Songti SC', serif;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            line-height: 2.2;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: #fffcf8;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            border: 1px solid #e6d9cc;
        }
        h1 {
            font-size: 2.2rem;
            text-align: center;
            color: #5e3e2b;
            letter-spacing: 4px;
            font-weight: 500;
            margin-bottom: 0.5rem;
            border-bottom: 2px solid #d9c6b0;
            padding-bottom: 1.2rem;
        }
        .subhead {
            text-align: center;
            font-size: 1.1rem;
            color: #8b6f55;
            margin-bottom: 1rem;
            letter-spacing: 2px;
            font-style: italic;
        }
        .jumpbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem;
            margin: 1.2rem 0 2.5rem 0;
            padding: 0.9rem;
            background: #f4ebe2;
            border-radius: 14px;
            border: 1px solid #e6d9cc;
        }
        .jumpbar a {
            text-decoration: none;
            font-size: 0.92rem;
            color: #5e3e2b;
            background: #fffcf8;
            border: 1px solid #d9c6b0;
            border-radius: 10px;
            padding: 0.35rem 0.8rem;
            transition: background 0.2s, color 0.2s;
        }
        .jumpbar a:hover { background: #5e3e2b; color: #fff8f0; }
        .chapter-title {
            font-size: 1.6rem;
            text-align: center;
            color: #4a3322;
            margin: 2rem 0 2.5rem 0;
            font-weight: 600;
            letter-spacing: 3px;
            background: linear-gradient(to right, transparent, #efe3d8, transparent);
            padding: 0.8rem 0;
            scroll-margin-top: 1.5rem;
        }
        .chapter-title .eng-title {
            display: block;
            font-size: 1rem;
            font-weight: 400;
            color: #8b6f55;
            letter-spacing: 1px;
            margin-top: 0.4rem;
            font-style: italic;
        }
        .paragraph { margin-bottom: 2.2rem; text-align: justify; }
        .sentence { display: block; margin-bottom: 1.5rem; }
        .zh-line { display: block; margin-bottom: 0.3rem; }
        .word {
            display: inline-block;
            position: relative;
            cursor: pointer;
            font-size: 1.25rem;
            font-family: 'Noto Serif SC', 'KaiTi', serif;
            color: #1f1a15;
            margin: 0 0.05em;
            padding: 0.05em 0.1em;
            border-radius: 4px;
            transition: background-color 0.2s;
            vertical-align: middle;
        }
        .word:hover { background-color: #f0e4d8; }
        .word.revealed {
            background-color: #f4e8dc;
            box-shadow: 0 0 0 1px #d9c6b0;
        }
        .punct {
            font-family: 'Noto Serif SC', 'KaiTi', serif;
            font-size: 1.25rem;
            color: #1f1a15;
            vertical-align: middle;
        }
        .pinyin {
            display: none;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 100%;
            margin-bottom: 2px;
            background-color: #5e3e2b;
            color: #fff8f0;
            font-size: 0.7rem;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            letter-spacing: 0.5px;
            padding: 0.15em 0.5em;
            border-radius: 12px;
            white-space: nowrap;
            z-index: 10;
            line-height: 1.4;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            pointer-events: none;
        }
        .word.revealed .pinyin { display: block; }
        .eng-line {
            display: block;
            font-size: 0.95rem;
            color: #7a6554;
            font-family: 'Segoe UI', 'Georgia', serif;
            line-height: 1.6;
            padding-left: 0.5rem;
            border-left: 2px solid #d9c6b0;
            margin-top: 0.2rem;
            margin-bottom: 0.4rem;
            font-style: italic;
        }
        .note {
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px dashed #cdb9a8;
            font-size: 0.9rem;
            color: #7a5e4b;
            text-align: center;
            font-style: italic;
        }
        .hint {
            text-align: center;
            font-size: 0.85rem;
            color: #a0785a;
            margin-bottom: 1rem;
            font-style: italic;
        }
        @media (max-width: 600px) {
            .container { padding: 1.8rem 1.2rem; }
            h1 { font-size: 1.6rem; letter-spacing: 2px; }
            .word, .punct { font-size: 1.1rem; }
            .chapter-title { font-size: 1.2rem; }
            .eng-line { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>三国演义</h1>
    <div class="subhead">第十七回 · 点击汉字显示拼音 + 英译</div>
    <div class="hint">👆 点击任意汉字即可显示/隐藏其拼音</div>

    <nav class="jumpbar">
        <a href="#s1">袁术称帝</a>
        <a href="#s2">七军攻徐</a>
        <a href="#s3">吕布出兵</a>
        <a href="#s4">曹操亲征</a>
    </nav>

    <div id="story"></div>

    <div class="note">
        —— 第十七回 · 点击汉字显示拼音 + 英译 ——
    </div>
</div>

<script>
const SENTENCES = [
    {
        type: "title",
        zh: "袁|yuán 公|gōng 路|lù 起|qǐ 七|qī 军|jūn 攻|gōng 徐|xú 州|zhōu · 曹|cáo 孟|mèng 德|dé 会|huì 三|sān 将|jiàng 袭|xí 吕|lǚ 布|bù",
        en: "Yuan Gonglu Raises Seven Armies to Attack Xuzhou; Cao Mengde Meets Three Generals and Raids Lü Bu"
    },
    {
        type: "para", id: "s1",
        sentences: [
            {
                zh: "袁|yuán 术|shù 在|zài 淮|huái 南|nán 称|chēng 帝|dì ，建|jiàn 号|hào “仲|zhòng 家|jiā ”，分|fēn 封|fēng 百|bǎi 官|guān 。他|tā 骄|jiāo 奢|shē 荒|huāng 淫|yín ，横|héng 征|zhēng 暴|bào 敛|liǎn ，百|bǎi 姓|xìng 怨|yuàn 声|shēng 载|zài 道|dào 。",
                en: "Yuan Shu declared himself emperor in Huainan, adopting the reign title \"Zhongjia\" and enfeoffing officials. He was arrogant, extravagant, and dissolute, imposing harsh taxes and extortions, and the people's resentment was everywhere."
            },
            {
                zh: "袁|yuán 术|shù 欲|yù 先|xiān 灭|miè 刘|liú 备|bèi 、吕|lǚ 布|bù ，再|zài 图|tú 曹|cáo 操|cāo ，于|yú 是|shì 起|qǐ 七|qī 路|lù 大|dà 军|jūn ，声|shēng 势|shì 浩|hào 大|dà ，杀|shā 奔|bēn 徐|xú 州|zhōu 。",
                en: "Yuan Shu wished to destroy Liu Bei and Lü Bu first, then deal with Cao Cao. He raised seven armies in a mighty host and marched on Xuzhou."
            }
        ]
    },
    {
        type: "para", id: "s2",
        sentences: [
            {
                zh: "吕|lǚ 布|bù 闻|wén 袁|yuán 术|shù 来|lái 攻|gōng ，急|jí 忙|máng 召|zhào 集|jí 谋|móu 士|shì 商|shāng 议|yì 。陈|chén 宫|gōng 献|xiàn 计|jì ，劝|quàn 吕|lǚ 布|bù 联|lián 合|hé 刘|liú 备|bèi 共|gòng 抗|kàng 袁|yuán 术|shù ，并|bìng 以|yǐ 利|lì 诱|yòu 袁|yuán 术|shù 部|bù 将|jiàng 韩|hán 暹|xiān 、杨|yáng 奉|fèng 倒|dǎo 戈|gē 。",
                en: "When Lü Bu learned of Yuan Shu's attack, he hastily gathered his advisors. Chen Gong proposed that Lü Bu ally with Liu Bei against Yuan Shu and lure Yuan Shu's officers Han Xian and Yang Feng to turn against him with promises of profit."
            }
        ]
    },
    {
        type: "para", id: "s3",
        sentences: [
            {
                zh: "吕|lǚ 布|bù 依|yī 计|jì 而|ér 行|xíng ，韩|hán 暹|xiān 、杨|yáng 奉|fèng 果|guǒ 然|rán 反|fǎn 叛|pàn 袁|yuán 术|shù ，与|yǔ 吕|lǚ 布|bù 夹|jiā 击|jī 袁|yuán 军|jūn 。袁|yuán 术|shù 大|dà 败|bài ，七|qī 路|lù 军|jūn 马|mǎ 溃|kuì 散|sàn 。",
                en: "Lü Bu followed the plan, and Han Xian and Yang Feng indeed turned against Yuan Shu, joining Lü Bu in a pincer attack on the Yuan army. Yuan Shu was badly defeated, and his seven armies scattered."
            }
        ]
    },
    {
        type: "para", id: "s4",
        sentences: [
            {
                zh: "曹|cáo 操|cāo 见|jiàn 袁|yuán 术|shù 势|shì 衰|shuāi ，决|jué 意|yì 亲|qīn 征|zhēng 徐|xú 州|zhōu ，先|xiān 除|chú 吕|lǚ 布|bù 。他|tā 会|huì 合|hé 刘|liú 备|bèi 、陈|chén 登|dēng 等|děng 三|sān 路|lù 兵|bīng 马|mǎ ，准|zhǔn 备|bèi 合|hé 力|lì 进|jìn 攻|gōng 吕|lǚ 布|bù 。",
                en: "Seeing Yuan Shu's decline, Cao Cao resolved to campaign personally against Xuzhou and first eliminate Lü Bu. He joined forces with Liu Bei, Chen Deng, and others in three columns, preparing a combined assault on Lü Bu."
            }
        ]
    }
];

function tokenToHtml(tok) {
    if (tok.startsWith("RAW")) return tok.slice(3);
    if (tok.includes("|")) {
        const [ch, py] = tok.split("|");
        return `<span class="word" data-pinyin="${py}">${ch}</span>`;
    }
    return `<span class="punct">${tok}</span>`;
}

function renderZh(zh) {
    return zh.split(/\s+/).filter(Boolean).map(tokenToHtml).join("");
}

function renderSentence(s) {
    return `<div class="sentence">
        <span class="zh-line">${renderZh(s.zh)}</span>
        <span class="eng-line">${s.en}</span>
    </div>`;
}

function render() {
    const root = document.getElementById("story");
    let html = "";
    for (const block of SENTENCES) {
        if (block.type === "title") {
            html += `<div class="chapter-title">${renderZh(block.zh)}<span class="eng-title">${block.en}</span></div>`;
        } else if (block.type === "para") {
            html += `<div class="paragraph"${block.id ? ` id="${block.id}"` : ""}>${block.sentences.map(renderSentence).join("")}</div>`;
        }
    }
    root.innerHTML = html;
    bindWords();
}

function bindWords() {
    document.querySelectorAll(".word").forEach(function (word) {
        var pinyinText = word.getAttribute("data-pinyin");
        if (pinyinText) {
            var pinyinSpan = document.createElement("span");
            pinyinSpan.className = "pinyin";
            pinyinSpan.textContent = pinyinText;
            word.appendChild(pinyinSpan);
        }
        word.addEventListener("click", function (e) {
            e.stopPropagation();
            this.classList.toggle("revealed");
        });
    });
}

document.addEventListener("click", function () {
    document.querySelectorAll(".word.revealed").forEach(function (w) {
        w.classList.remove("revealed");
    });
});

render();
</script>
</body>
</html>
