<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三国演义 · 第十六回 · 点击显示拼音 + 英译</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #f8f5f0;
            font-family: 'Segoe UI', 'Noto Serif SC', 'KaiTi', '楷体', 'Songti SC', serif;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            line-height: 2.2;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: #fffcf8;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            border: 1px solid #e6d9cc;
        }
        h1 {
            font-size: 2.2rem;
            text-align: center;
            color: #5e3e2b;
            letter-spacing: 4px;
            font-weight: 500;
            margin-bottom: 0.5rem;
            border-bottom: 2px solid #d9c6b0;
            padding-bottom: 1.2rem;
        }
        .subhead {
            text-align: center;
            font-size: 1.1rem;
            color: #8b6f55;
            margin-bottom: 1rem;
            letter-spacing: 2px;
            font-style: italic;
        }
        .jumpbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem;
            margin: 1.2rem 0 2.5rem 0;
            padding: 0.9rem;
            background: #f4ebe2;
            border-radius: 14px;
            border: 1px solid #e6d9cc;
        }
        .jumpbar a {
            text-decoration: none;
            font-size: 0.92rem;
            color: #5e3e2b;
            background: #fffcf8;
            border: 1px solid #d9c6b0;
            border-radius: 10px;
            padding: 0.35rem 0.8rem;
            transition: background 0.2s, color 0.2s;
        }
        .jumpbar a:hover { background: #5e3e2b; color: #fff8f0; }
        .chapter-title {
            font-size: 1.6rem;
            text-align: center;
            color: #4a3322;
            margin: 2rem 0 2.5rem 0;
            font-weight: 600;
            letter-spacing: 3px;
            background: linear-gradient(to right, transparent, #efe3d8, transparent);
            padding: 0.8rem 0;
            scroll-margin-top: 1.5rem;
        }
        .chapter-title .eng-title {
            display: block;
            font-size: 1rem;
            font-weight: 400;
            color: #8b6f55;
            letter-spacing: 1px;
            margin-top: 0.4rem;
            font-style: italic;
        }
        .paragraph { margin-bottom: 2.2rem; text-align: justify; }
        .sentence { display: block; margin-bottom: 1.5rem; }
        .zh-line { display: block; margin-bottom: 0.3rem; }
        .word {
            display: inline-block;
            position: relative;
            cursor: pointer;
            font-size: 1.25rem;
            font-family: 'Noto Serif SC', 'KaiTi', serif;
            color: #1f1a15;
            margin: 0 0.05em;
            padding: 0.05em 0.1em;
            border-radius: 4px;
            transition: background-color 0.2s;
            vertical-align: middle;
        }
        .word:hover { background-color: #f0e4d8; }
        .word.revealed {
            background-color: #f4e8dc;
            box-shadow: 0 0 0 1px #d9c6b0;
        }
        .punct {
            font-family: 'Noto Serif SC', 'KaiTi', serif;
            font-size: 1.25rem;
            color: #1f1a15;
            vertical-align: middle;
        }
        .pinyin {
            display: none;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 100%;
            margin-bottom: 2px;
            background-color: #5e3e2b;
            color: #fff8f0;
            font-size: 0.7rem;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            letter-spacing: 0.5px;
            padding: 0.15em 0.5em;
            border-radius: 12px;
            white-space: nowrap;
            z-index: 10;
            line-height: 1.4;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            pointer-events: none;
        }
        .word.revealed .pinyin { display: block; }
        .eng-line {
            display: block;
            font-size: 0.95rem;
            color: #7a6554;
            font-family: 'Segoe UI', 'Georgia', serif;
            line-height: 1.6;
            padding-left: 0.5rem;
            border-left: 2px solid #d9c6b0;
            margin-top: 0.2rem;
            margin-bottom: 0.4rem;
            font-style: italic;
        }
        .note {
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px dashed #cdb9a8;
            font-size: 0.9rem;
            color: #7a5e4b;
            text-align: center;
            font-style: italic;
        }
        .hint {
            text-align: center;
            font-size: 0.85rem;
            color: #a0785a;
            margin-bottom: 1rem;
            font-style: italic;
        }
        @media (max-width: 600px) {
            .container { padding: 1.8rem 1.2rem; }
            h1 { font-size: 1.6rem; letter-spacing: 2px; }
            .word, .punct { font-size: 1.1rem; }
            .chapter-title { font-size: 1.2rem; }
            .eng-line { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>三国演义</h1>
    <div class="subhead">第十六回 · 点击汉字显示拼音 + 英译</div>
    <div class="hint">👆 点击任意汉字即可显示/隐藏其拼音</div>

    <nav class="jumpbar">
        <a href="#s1">辕门射戟</a>
        <a href="#s2">吕布解围</a>
        <a href="#s3">曹操伐张绣</a>
        <a href="#s4">淯水之败</a>
    </nav>

    <div id="story"></div>

    <div class="note">
        —— 第十六回 · 点击汉字显示拼音 + 英译 ——
    </div>
</div>

<script>
const SENTENCES = [
    {
        type: "title",
        zh: "吕|lǚ 奉|fèng 先|xiān 辕|yuán 门|mén 射|shè 戟|jǐ · 曹|cáo 孟|mèng 德|dé 败|bài 师|shī 淯|yù 水|shuǐ",
        en: "Lü Fengxian Shoots the Halberd at the Camp Gate; Cao Mengde Loses His Army at the Yu River"
    },
    {
        type: "para", id: "s1",
        sentences: [
            {
                zh: "袁|yuán 术|shù 派|pài 大|dà 将|jiàng 纪|jì 灵|líng 率|shuài 军|jūn 攻|gōng 打|dǎ 小|xiǎo 沛|pèi ，刘|liú 备|bèi 兵|bīng 少|shǎo 难|nán 敌|dí ，向|xiàng 吕|lǚ 布|bù 求|qiú 救|jiù 。吕|lǚ 布|bù 恐|kǒng 袁|yuán 术|shù 灭|miè 刘|liú 备|bèi 后|hòu 势|shì 大|dà ，决|jué 意|yì 出|chū 面|miàn 调|tiáo 停|tíng 。",
                en: "Yuan Shu sent his general Ji Ling with an army to attack Xiaopei. Liu Bei, too weak to resist, sought help from Lü Bu. Fearing that Yuan Shu would grow too powerful after destroying Liu Bei, Lü Bu decided to intervene as a mediator."
            }
        ]
    },
    {
        type: "para", id: "s2",
        sentences: [
            {
                zh: "吕|lǚ 布|bù 在|zài 辕|yuán 门|mén 设|shè 宴|yàn ，请|qǐng 刘|liú 备|bèi 与|yǔ 纪|jì 灵|líng 赴|fù 会|huì 。他|tā 命|mìng 人|rén 将|jiāng 方|fāng 天|tiān 画|huà 戟|jǐ 立|lì 于|yú 辕|yuán 门|mén 外|wài 一|yī 百|bǎi 五|wǔ 十|shí 步|bù 处|chù ，说|shuō ：“若|ruò 我|wǒ 一|yī 箭|jiàn 射|shè 中|zhòng 戟|jǐ 上|shàng 小|xiǎo 枝|zhī ，两|liǎng 家|jiā 罢|bà 兵|bīng ；若|ruò 不|bù 中|zhòng ，任|rèn 凭|píng 厮|sī 杀|shā 。”",
                en: "Lü Bu held a banquet at the camp gate and invited both Liu Bei and Ji Ling. He had his halberd set up a hundred and fifty paces outside the gate and said: \"If I hit the small branch of the halberd with one arrow, both sides will cease hostilities; if I miss, you may fight as you please.\""
            },
            {
                zh: "只|zhǐ 见|jiàn 吕|lǚ 布|bù 挽|wǎn 弓|gōng 搭|dā 箭|jiàn ，一|yī 箭|jiàn 正|zhèng 中|zhòng 戟|jǐ 上|shàng 小|xiǎo 枝|zhī 。众|zhòng 人|rén 齐|qí 声|shēng 喝|hè 彩|cǎi ，纪|jì 灵|líng 只|zhǐ 得|de 退|tuì 兵|bīng ，刘|liú 备|bèi 之|zhī 围|wéi 遂|suì 解|jiě 。",
                en: "Lü Bu drew his bow and loosed an arrow that struck the small branch of the halberd dead on. Everyone cheered in unison, and Ji Ling had no choice but to withdraw his troops; the siege of Liu Bei was lifted."
            }
        ]
    },
    {
        type: "para", id: "s3",
        sentences: [
            {
                zh: "曹|cáo 操|cāo 欲|yù 南|nán 征|zhēng 张|zhāng 绣|xiù ，张|zhāng 绣|xiù 采|cǎi 纳|nà 贾|jiǎ 诩|xǔ 之|zhī 计|jì ，假|jiǎ 意|yì 投|tóu 降|xiáng ，迎|yíng 曹|cáo 操|cāo 入|rù 宛|wǎn 城|chéng 。曹|cáo 操|cāo 志|zhì 得|dé 意|yì 满|mǎn ，不|bù 加|jiā 防|fáng 备|bèi 。",
                en: "Cao Cao wished to campaign south against Zhang Xiu. Following Jia Xu's plan, Zhang Xiu feigned surrender and welcomed Cao Cao into Wan City. Cao Cao was smug and complacent, taking no precautions."
            }
        ]
    },
    {
        type: "para", id: "s4",
        sentences: [
            {
                zh: "张|zhāng 绣|xiù 突|tū 然|rán 反|fǎn 叛|pàn ，夜|yè 袭|xí 曹|cáo 营|yíng 。曹|cáo 操|cāo 大|dà 败|bài ，仓|cāng 皇|huáng 逃|táo 走|zǒu ，长|cháng 子|zǐ 曹|cáo 昂|áng 、侄|zhí 曹|cáo 安|ān 民|mín 皆|jiē 遇|yù 害|hài ，猛|měng 将|jiàng 典|diǎn 韦|wéi 力|lì 战|zhàn 而|ér 死|sǐ 。曹|cáo 操|cāo 退|tuì 回|huí 许|jú 都|dū ，深|shēn 悔|huǐ 轻|qīng 敌|dí 。",
                en: "Zhang Xiu suddenly revolted and raided Cao Cao's camp at night. Cao Cao was badly defeated and fled in panic; his eldest son Cao Ang and his nephew Cao Anmin were both killed, and his fierce general Dian Wei died fighting to the last. Cao Cao withdrew to Xudu, deeply regretting his carelessness."
            }
        ]
    }
];

function tokenToHtml(tok) {
    if (tok.startsWith("RAW")) return tok.slice(3);
    if (tok.includes("|")) {
        const [ch, py] = tok.split("|");
        return `<span class="word" data-pinyin="${py}">${ch}</span>`;
    }
    return `<span class="punct">${tok}</span>`;
}

function renderZh(zh) {
    return zh.split(/\s+/).filter(Boolean).map(tokenToHtml).join("");
}

function renderSentence(s) {
    return `<div class="sentence">
        <span class="zh-line">${renderZh(s.zh)}</span>
        <span class="eng-line">${s.en}</span>
    </div>`;
}

function render() {
    const root = document.getElementById("story");
    let html = "";
    for (const block of SENTENCES) {
        if (block.type === "title") {
            html += `<div class="chapter-title">${renderZh(block.zh)}<span class="eng-title">${block.en}</span></div>`;
        } else if (block.type === "para") {
            html += `<div class="paragraph"${block.id ? ` id="${block.id}"` : ""}>${block.sentences.map(renderSentence).join("")}</div>`;
        }
    }
    root.innerHTML = html;
    bindWords();
}

function bindWords() {
    document.querySelectorAll(".word").forEach(function (word) {
        var pinyinText = word.getAttribute("data-pinyin");
        if (pinyinText) {
            var pinyinSpan = document.createElement("span");
            pinyinSpan.className = "pinyin";
            pinyinSpan.textContent = pinyinText;
            word.appendChild(pinyinSpan);
        }
        word.addEventListener("click", function (e) {
            e.stopPropagation();
            this.classList.toggle("revealed");
        });
    });
}

document.addEventListener("click", function () {
    document.querySelectorAll(".word.revealed").forEach(function (w) {
        w.classList.remove("revealed");
    });
});

render();
</script>
</body>
</html>
