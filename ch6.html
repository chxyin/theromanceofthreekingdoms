<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三国演义 · 第六回 · 点击显示拼音 + 英译</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #f8f5f0;
            font-family: 'Segoe UI', 'Noto Serif SC', 'KaiTi', '楷体', 'Songti SC', serif;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            line-height: 2.2;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: #fffcf8;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            border: 1px solid #e6d9cc;
        }
        h1 {
            font-size: 2.2rem;
            text-align: center;
            color: #5e3e2b;
            letter-spacing: 4px;
            font-weight: 500;
            margin-bottom: 0.5rem;
            border-bottom: 2px solid #d9c6b0;
            padding-bottom: 1.2rem;
        }
        .subhead {
            text-align: center;
            font-size: 1.1rem;
            color: #8b6f55;
            margin-bottom: 1rem;
            letter-spacing: 2px;
            font-style: italic;
        }
        .jumpbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem;
            margin: 1.2rem 0 2.5rem 0;
            padding: 0.9rem;
            background: #f4ebe2;
            border-radius: 14px;
            border: 1px solid #e6d9cc;
        }
        .jumpbar a {
            text-decoration: none;
            font-size: 0.92rem;
            color: #5e3e2b;
            background: #fffcf8;
            border: 1px solid #d9c6b0;
            border-radius: 10px;
            padding: 0.35rem 0.8rem;
            transition: background 0.2s, color 0.2s;
        }
        .jumpbar a:hover { background: #5e3e2b; color: #fff8f0; }
        .chapter-title {
            font-size: 1.6rem;
            text-align: center;
            color: #4a3322;
            margin: 2rem 0 2.5rem 0;
            font-weight: 600;
            letter-spacing: 3px;
            background: linear-gradient(to right, transparent, #efe3d8, transparent);
            padding: 0.8rem 0;
            scroll-margin-top: 1.5rem;
        }
        .chapter-title .eng-title {
            display: block;
            font-size: 1rem;
            font-weight: 400;
            color: #8b6f55;
            letter-spacing: 1px;
            margin-top: 0.4rem;
            font-style: italic;
        }
        .paragraph { margin-bottom: 2.2rem; text-align: justify; }
        .sentence { display: block; margin-bottom: 1.5rem; }
        .zh-line { display: block; margin-bottom: 0.3rem; }
        .word {
            display: inline-block;
            position: relative;
            cursor: pointer;
            font-size: 1.25rem;
            font-family: 'Noto Serif SC', 'KaiTi', serif;
            color: #1f1a15;
            margin: 0 0.05em;
            padding: 0.05em 0.1em;
            border-radius: 4px;
            transition: background-color 0.2s;
            vertical-align: middle;
        }
        .word:hover { background-color: #f0e4d8; }
        .word.revealed {
            background-color: #f4e8dc;
            box-shadow: 0 0 0 1px #d9c6b0;
        }
        .punct {
            font-family: 'Noto Serif SC', 'KaiTi', serif;
            font-size: 1.25rem;
            color: #1f1a15;
            vertical-align: middle;
        }
        .pinyin {
            display: none;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 100%;
            margin-bottom: 2px;
            background-color: #5e3e2b;
            color: #fff8f0;
            font-size: 0.7rem;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            letter-spacing: 0.5px;
            padding: 0.15em 0.5em;
            border-radius: 12px;
            white-space: nowrap;
            z-index: 10;
            line-height: 1.4;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            pointer-events: none;
        }
        .word.revealed .pinyin { display: block; }
        .eng-line {
            display: block;
            font-size: 0.95rem;
            color: #7a6554;
            font-family: 'Segoe UI', 'Georgia', serif;
            line-height: 1.6;
            padding-left: 0.5rem;
            border-left: 2px solid #d9c6b0;
            margin-top: 0.2rem;
            margin-bottom: 0.4rem;
            font-style: italic;
        }
        .note {
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px dashed #cdb9a8;
            font-size: 0.9rem;
            color: #7a5e4b;
            text-align: center;
            font-style: italic;
        }
        .hint {
            text-align: center;
            font-size: 0.85rem;
            color: #a0785a;
            margin-bottom: 1rem;
            font-style: italic;
        }
        @media (max-width: 600px) {
            .container { padding: 1.8rem 1.2rem; }
            h1 { font-size: 1.6rem; letter-spacing: 2px; }
            .word, .punct { font-size: 1.1rem; }
            .chapter-title { font-size: 1.2rem; }
            .eng-line { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>三国演义</h1>
    <div class="subhead">第六回 · 点击汉字显示拼音 + 英译</div>
    <div class="hint">👆 点击任意汉字即可显示/隐藏其拼音</div>

    <nav class="jumpbar">
        <a href="#s1">焚宫</a>
        <a href="#s2">追董</a>
        <a href="#s3">玉玺</a>
    </nav>

    <div id="story"></div>

    <div class="note">
        —— 第六回 · 点击汉字显示拼音 + 英译 ——
    </div>
</div>

<script>
const SENTENCES = [
    {
        type: "title",
        zh: "焚|fén 金|jīn 阙|què 董|dǒng 卓|zhuó 行|xíng 凶|xiōng · 匿|nì 玉|yù 玺|xǐ 孙|sūn 坚|jiān 背|bèi 约|yuē",
        en: "Burning the Golden Palace, Dong Zhuo Commits Atrocities; Hiding the Imperial Seal, Sun Jian Breaks the Oath"
    },
    {
        type: "para", id: "s1",
        sentences: [
            {
                zh: "董|dǒng 卓|zhuó 见|jiàn 诸|zhū 侯|hóu 势|shì 大|dà ，决|jué 定|dìng 迁|qiān 都|dū 长|cháng 安|ān 。临|lín 行|xíng 之|zhī 前|qián ，他|tā 焚|fén 烧|shāo 洛|luò 阳|yáng 宫|gōng 殿|diàn 、民|mín 房|fáng ，劫|jié 掠|lüè 百|bǎi 姓|xìng ，一|yī 片|piàn 火|huǒ 海|hǎi 。",
                en: "Seeing the strength of the allied lords, Dong Zhuo decided to move the capital to Chang'an. Before leaving, he burned the palaces and homes of Luoyang, plundered the people, and left a sea of fire."
            },
            {
                zh: "曹|cáo 操|cāo 劝|quàn 袁|yuán 绍|shào 乘|chéng 胜|shèng 追|zhuī 击|jī ，袁|yuán 绍|shào 等|děng 人|rén 不|bù 肯|kěn 。曹|cáo 操|cāo 独|dú 自|zì 率|shuài 兵|bīng 追|zhuī 赶|gǎn ，却|què 被|bèi 董|dǒng 卓|zhuó 伏|fú 兵|bīng 击|jī 败|bài ，损|sǔn 兵|bīng 折|zhé 将|jiàng 。",
                en: "Cao Cao urged Yuan Shao to pursue the retreating enemy while they were still off balance, but Yuan Shao and the others refused. Cao Cao led his troops in pursuit alone, but was ambushed by Dong Zhuo's hidden forces and suffered heavy losses."
            }
        ]
    },
    {
        type: "para", id: "s2",
        sentences: [
            {
                zh: "孙|sūn 坚|jiān 率|shuài 军|jūn 先|xiān 入|rù 洛|luò 阳|yáng ，扑|pū 灭|miè 大|dà 火|huǒ ，安|ān 抚|fǔ 百|bǎi 姓|xìng 。他|tā 在|zài 宫|gōng 中|zhōng 废|fèi 墟|wū 之|zhī 上|shàng 屯|tún 兵|bīng ，夜|yè 间|jiān 见|jiàn 殿|diàn 南|nán 有|yǒu 五|wǔ 色|sè 光|guāng 芒|máng 冲|chōng 天|tiān 。",
                en: "Sun Jian led his troops into Luoyang first, extinguished the great fire, and comforted the people. He encamped amid the ruins of the palace, and at night saw a five-colored radiance rising into the sky south of the hall."
            }
        ]
    },
    {
        type: "para", id: "s3",
        sentences: [
            {
                zh: "孙|sūn 坚|jiān 命|mìng 人|rén 挖|wā 掘|jué ，得|dé 一|yī 玉|yù 玺|xǐ ，上|shàng 刻|kè “受|shòu 命|mìng 于|yú 天|tiān ，既|jì 寿|shòu 永|yǒng 昌|chāng ”八|bā 字|zì ，乃|nǎi 传|chuán 国|guó 玉|yù 玺|xǐ 。孙|sūn 坚|jiān 暗|àn 藏|cáng 之|zhī ，诈|zhà 称|chēng 有|yǒu 病|bìng ，欲|yù 回|huí 江|jiāng 东|dōng 。",
                en: "Sun Jian ordered his men to dig and found a jade seal inscribed with the eight characters \"By the mandate of Heaven, may your reign be long and prosperous\" — the Imperial Seal. Sun Jian secretly concealed it, feigned illness, and wished to return to Jiangdong."
            },
            {
                zh: "袁|yuán 绍|shào 得|dé 知|zhī 此|zhǐ 事|shì ，前|qián 来|lái 索|suǒ 要|yào ，孙|sūn 坚|jiān 矢|shǐ 口|kǒu 否|fǒu 认|rèn 。两|liǎng 人|rén 由|yóu 此|cǐ 结|jié 怨|yuàn ，盟|méng 军|jūn 离|lí 心|xīn 解|jiě 体|tǐ 。",
                en: "When Yuan Shao learned of this, he came to demand the seal, but Sun Jian denied it categorically. The two became enemies because of this, and the alliance began to fall apart."
            }
        ]
    }
];

function tokenToHtml(tok) {
    if (tok.startsWith("RAW")) return tok.slice(3);
    if (tok.includes("|")) {
        const [ch, py] = tok.split("|");
        return `<span class="word" data-pinyin="${py}">${ch}</span>`;
    }
    return `<span class="punct">${tok}</span>`;
}

function renderZh(zh) {
    return zh.split(/\s+/).filter(Boolean).map(tokenToHtml).join("");
}

function renderSentence(s) {
    return `<div class="sentence">
        <span class="zh-line">${renderZh(s.zh)}</span>
        <span class="eng-line">${s.en}</span>
    </div>`;
}

function render() {
    const root = document.getElementById("story");
    let html = "";
    for (const block of SENTENCES) {
        if (block.type === "title") {
            html += `<div class="chapter-title">${renderZh(block.zh)}<span class="eng-title">${block.en}</span></div>`;
        } else if (block.type === "para") {
            html += `<div class="paragraph"${block.id ? ` id="${block.id}"` : ""}>${block.sentences.map(renderSentence).join("")}</div>`;
        }
    }
    root.innerHTML = html;
    bindWords();
}

function bindWords() {
    document.querySelectorAll(".word").forEach(function (word) {
        var pinyinText = word.getAttribute("data-pinyin");
        if (pinyinText) {
            var pinyinSpan = document.createElement("span");
            pinyinSpan.className = "pinyin";
            pinyinSpan.textContent = pinyinText;
            word.appendChild(pinyinSpan);
        }
        word.addEventListener("click", function (e) {
            e.stopPropagation();
            this.classList.toggle("revealed");
        });
    });
}

document.addEventListener("click", function () {
    document.querySelectorAll(".word.revealed").forEach(function (w) {
        w.classList.remove("revealed");
    });
});

render();
</script>
</body>
</html>
