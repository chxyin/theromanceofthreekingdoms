<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三国演义 · 第十九回 · 点击显示拼音 + 英译</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #f8f5f0;
            font-family: 'Segoe UI', 'Noto Serif SC', 'KaiTi', '楷体', 'Songti SC', serif;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            line-height: 2.2;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: #fffcf8;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            border: 1px solid #e6d9cc;
        }
        h1 {
            font-size: 2.2rem;
            text-align: center;
            color: #5e3e2b;
            letter-spacing: 4px;
            font-weight: 500;
            margin-bottom: 0.5rem;
            border-bottom: 2px solid #d9c6b0;
            padding-bottom: 1.2rem;
        }
        .subhead {
            text-align: center;
            font-size: 1.1rem;
            color: #8b6f55;
            margin-bottom: 1rem;
            letter-spacing: 2px;
            font-style: italic;
        }
        .jumpbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem;
            margin: 1.2rem 0 2.5rem 0;
            padding: 0.9rem;
            background: #f4ebe2;
            border-radius: 14px;
            border: 1px solid #e6d9cc;
        }
        .jumpbar a {
            text-decoration: none;
            font-size: 0.92rem;
            color: #5e3e2b;
            background: #fffcf8;
            border: 1px solid #d9c6b0;
            border-radius: 10px;
            padding: 0.35rem 0.8rem;
            transition: background 0.2s, color 0.2s;
        }
        .jumpbar a:hover { background: #5e3e2b; color: #fff8f0; }
        .chapter-title {
            font-size: 1.6rem;
            text-align: center;
            color: #4a3322;
            margin: 2rem 0 2.5rem 0;
            font-weight: 600;
            letter-spacing: 3px;
            background: linear-gradient(to right, transparent, #efe3d8, transparent);
            padding: 0.8rem 0;
            scroll-margin-top: 1.5rem;
        }
        .chapter-title .eng-title {
            display: block;
            font-size: 1rem;
            font-weight: 400;
            color: #8b6f55;
            letter-spacing: 1px;
            margin-top: 0.4rem;
            font-style: italic;
        }
        .paragraph { margin-bottom: 2.2rem; text-align: justify; }
        .sentence { display: block; margin-bottom: 1.5rem; }
        .zh-line { display: block; margin-bottom: 0.3rem; }
        .word {
            display: inline-block;
            position: relative;
            cursor: pointer;
            font-size: 1.25rem;
            font-family: 'Noto Serif SC', 'KaiTi', serif;
            color: #1f1a15;
            margin: 0 0.05em;
            padding: 0.05em 0.1em;
            border-radius: 4px;
            transition: background-color 0.2s;
            vertical-align: middle;
        }
        .word:hover { background-color: #f0e4d8; }
        .word.revealed {
            background-color: #f4e8dc;
            box-shadow: 0 0 0 1px #d9c6b0;
        }
        .punct {
            font-family: 'Noto Serif SC', 'KaiTi', serif;
            font-size: 1.25rem;
            color: #1f1a15;
            vertical-align: middle;
        }
        .pinyin {
            display: none;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 100%;
            margin-bottom: 2px;
            background-color: #5e3e2b;
            color: #fff8f0;
            font-size: 0.7rem;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            letter-spacing: 0.5px;
            padding: 0.15em 0.5em;
            border-radius: 12px;
            white-space: nowrap;
            z-index: 10;
            line-height: 1.4;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            pointer-events: none;
        }
        .word.revealed .pinyin { display: block; }
        .eng-line {
            display: block;
            font-size: 0.95rem;
            color: #7a6554;
            font-family: 'Segoe UI', 'Georgia', serif;
            line-height: 1.6;
            padding-left: 0.5rem;
            border-left: 2px solid #d9c6b0;
            margin-top: 0.2rem;
            margin-bottom: 0.4rem;
            font-style: italic;
        }
        .note {
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px dashed #cdb9a8;
            font-size: 0.9rem;
            color: #7a5e4b;
            text-align: center;
            font-style: italic;
        }
        .hint {
            text-align: center;
            font-size: 0.85rem;
            color: #a0785a;
            margin-bottom: 1rem;
            font-style: italic;
        }
        @media (max-width: 600px) {
            .container { padding: 1.8rem 1.2rem; }
            h1 { font-size: 1.6rem; letter-spacing: 2px; }
            .word, .punct { font-size: 1.1rem; }
            .chapter-title { font-size: 1.2rem; }
            .eng-line { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>三国演义</h1>
    <div class="subhead">第十九回 · 点击汉字显示拼音 + 英译</div>
    <div class="hint">👆 点击任意汉字即可显示/隐藏其拼音</div>

    <nav class="jumpbar">
        <a href="#s1">水淹下邳</a>
        <a href="#s2">吕布被困</a>
        <a href="#s3">侯成盗马</a>
        <a href="#s4">白门楼</a>
    </nav>

    <div id="story"></div>

    <div class="note">
        —— 第十九回 · 点击汉字显示拼音 + 英译 ——
    </div>
</div>

<script>
const SENTENCES = [
    {
        type: "title",
        zh: "下|xià 邳|pī 城|chéng 曹|cáo 操|cāo 鏖|áo 兵|bīng · 白|bái 门|mén 楼|lóu 吕|lǚ 布|bù 殒|yǔn 命|mìng",
        en: "Cao Cao Fights a Fierce Battle at Xiapi; Lü Bu Meets His End at the White Gate Tower"
    },
    {
        type: "para", id: "s1",
        sentences: [
            {
                zh: "曹|cáo 操|cāo 与|yǔ 刘|liú 备|bèi 合|hé 兵|bīng 围|wéi 攻|gōng 下|xià 邳|pī 。陈|chén 宫|gōng 劝|quàn 吕|lǚ 布|bù 出|chū 城|chéng 决|jué 战|zhàn ，吕|lǚ 布|bù 却|què 因|yīn 妻|qī 妾|qiè 哭|kū 阻|zǔ 而|ér 犹|yóu 豫|yù 不|bù 决|jué 。",
                en: "Cao Cao joined forces with Liu Bei to besiege Xiapi. Chen Gong urged Lü Bu to march out and fight a decisive battle, but Lü Bu hesitated because his wife and concubine wept and held him back."
            },
            {
                zh: "曹|cáo 操|cāo 采|cǎi 纳|nà 郭|guō 嘉|jiā 之|zhī 计|jì ，决|jué 沂|yí 水|shuǐ 、泗|sì 水|shuǐ 灌|guàn 城|chéng 。水|shuǐ 淹|yān 下|xià 邳|pī ，军|jūn 民|mín 慌|huāng 乱|luàn ，吕|lǚ 布|bù 军|jūn 心|xīn 涣|huàn 散|sàn 。",
                en: "Cao Cao adopted Guo Jia's plan and diverted the Yi and Si rivers to flood the city. With Xiapi submerged, soldiers and civilians panicked, and Lü Bu's army fell into disarray."
            }
        ]
    },
    {
        type: "para", id: "s2",
        sentences: [
            {
                zh: "吕|lǚ 布|bù 困|kùn 守|shǒu 孤|gū 城|chéng ，部|bù 将|jiàng 侯|hóu 成|chéng 、宋|sòng 宪|xiàn 、魏|wèi 续|xù 因|yīn 吕|lǚ 布|bù 苛|kē 责|zé 而|ér 心|xīn 怀|huái 怨|yuàn 恨|hèn 。侯|hóu 成|chéng 盗|dào 赤|chì 兔|tù 马|mǎ 出|chū 城|chéng 投|tóu 降|xiáng 曹|cáo 操|cāo 。",
                en: "Lü Bu held out in the isolated city, but his officers Hou Cheng, Song Xian, and Wei Xu resented his harsh treatment. Hou Cheng stole the Red Hare horse and slipped out to surrender to Cao Cao."
            }
        ]
    },
    {
        type: "para", id: "s3",
        sentences: [
            {
                zh: "宋|sòng 宪|xiàn 、魏|wèi 续|xù 趁|chèn 吕|lǚ 布|bù 熟|shú 睡|shuì 之|zhī 际|jì ，将|jiāng 其|qí 捆|kǔn 绑|bǎng ，献|xiàn 城|chéng 投|tóu 降|xiáng 。吕|lǚ 布|bù 被|bèi 押|yā 至|zhì 曹|cáo 操|cāo 面|miàn 前|qián ，仍|réng 然|rán 求|qiú 饶|ráo ，愿|yuàn 降|xiáng 曹|cáo 操|cāo 。",
                en: "While Lü Bu slept soundly, Song Xian and Wei Xu bound him and surrendered the city. Lü Bu was brought before Cao Cao and still begged for his life, offering to submit to Cao Cao."
            }
        ]
    },
    {
        type: "para", id: "s4",
        sentences: [
            {
                zh: "曹|cáo 操|cāo 问|wèn 刘|liú 备|bèi 如|rú 何|hé 处|chǔ 置|zhì 吕|lǚ 布|bù ，刘|liú 备|bèi 提|tí 起|qǐ 丁|dīng 原|yuán 、董|dǒng 卓|zhuó 之|zhī 事|shì 。曹|cáo 操|cāo 遂|suì 下|xià 令|lìng 将|jiāng 吕|lǚ 布|bù 缢|yì 死|sǐ 于|yú 白|bái 门|mén 楼|lóu ，陈|chén 宫|gōng 亦|yì 不|bù 肯|kěn 降|xiáng 而|ér 死|sǐ 。",
                en: "Cao Cao asked Liu Bei how Lü Bu should be dealt with, and Liu Bei brought up the fates of Ding Yuan and Dong Zhuo. Cao Cao then ordered Lü Bu strangled at the White Gate Tower. Chen Gong likewise refused to surrender and died."
            }
        ]
    }
];

function tokenToHtml(tok) {
    if (tok.startsWith("RAW")) return tok.slice(3);
    if (tok.includes("|")) {
        const [ch, py] = tok.split("|");
        return `<span class="word" data-pinyin="${py}">${ch}</span>`;
    }
    return `<span class="punct">${tok}</span>`;
}

function renderZh(zh) {
    return zh.split(/\s+/).filter(Boolean).map(tokenToHtml).join("");
}

function renderSentence(s) {
    return `<div class="sentence">
        <span class="zh-line">${renderZh(s.zh)}</span>
        <span class="eng-line">${s.en}</span>
    </div>`;
}

function render() {
    const root = document.getElementById("story");
    let html = "";
    for (const block of SENTENCES) {
        if (block.type === "title") {
            html += `<div class="chapter-title">${renderZh(block.zh)}<span class="eng-title">${block.en}</span></div>`;
        } else if (block.type === "para") {
            html += `<div class="paragraph"${block.id ? ` id="${block.id}"` : ""}>${block.sentences.map(renderSentence).join("")}</div>`;
        }
    }
    root.innerHTML = html;
    bindWords();
}

function bindWords() {
    document.querySelectorAll(".word").forEach(function (word) {
        var pinyinText = word.getAttribute("data-pinyin");
        if (pinyinText) {
            var pinyinSpan = document.createElement("span");
            pinyinSpan.className = "pinyin";
            pinyinSpan.textContent = pinyinText;
            word.appendChild(pinyinSpan);
        }
        word.addEventListener("click", function (e) {
            e.stopPropagation();
            this.classList.toggle("revealed");
        });
    });
}

document.addEventListener("click", function () {
    document.querySelectorAll(".word.revealed").forEach(function (w) {
        w.classList.remove("revealed");
    });
});

render();
</script>
</body>
</html>
